<style>
  /* Layout: one reading column. Every poem gets its own generated shell, taken from the
     foreword's line that the poems are like shells on a beach, each with its own shape, colour and size. */
  :root {
    --paper: #F4F1EA;
    --ink: #15191B;
    --muted: #5C6163;
    --rule: #D3CDC0;
    --accent: #C8201F;

    --shline: #15191B;
    --band: #15191B; --band-ink: #F4F1EA;

    --f-body: 'Noto Serif Tamil', 'Tiro Tamil', 'Latha', serif;
    --f-ui: 'Mukta Malar', 'Noto Sans Tamil', 'Latha', system-ui, sans-serif;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121517; --ink: #EDE9E0; --muted: #9DA3A4; --rule: #2B3134;
      --accent: #E4524B; --accent-soft: #3A1F1E; --tile: #1D2225;
      --sh1: #DB403A; --sh2: #EDE9E0; --sh3: #7A8284; --sh4: #3A4144; --sh5: #B1352F;
      --shline: #0B0D0E; --band: #0A0C0D; --band-ink: #EDE9E0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121517; --ink: #EDE9E0; --muted: #9DA3A4; --rule: #2B3134;
    --accent: #E4524B; --accent-soft: #3A1F1E; --tile: #1D2225;
    --sh1: #DB403A; --sh2: #EDE9E0; --sh3: #7A8284; --sh4: #3A4144; --sh5: #B1352F;
    --shline: #0B0D0E; --band: #0A0C0D; --band-ink: #EDE9E0;
    color-scheme: dark;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-ui);
    padding-block: 0 3rem;

  /* Header */
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 1.5rem; padding-block: 1rem 0.75rem; border-bottom: 3px solid var(--ink); }

  /* Home */

  .slab { height: 18px; background: var(--accent); background-image: repeating-linear-gradient(100deg, transparent 0 11px, var(--band) 11px 13px, transparent 13px 26px); }

  .btn.solid { background: var(--accent); color: #fff; }
  h2.sec { font: 600 0.8125rem/1.4 var(--f-ui); letter-spacing: 0.06em; color: var(--muted); margin: 2.25rem 0 0.75rem; }

  .search:focus-visible { border-color: var(--accent); }
  .count { font: 400 0.875rem/1.6 var(--f-ui); color: var(--muted); margin: 0.6rem 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.75rem, 1fr)); gap: 1.5rem 1rem; margin: 1.25rem 0 0; padding: 0; list-style: none; }
  .card { display: flex; flex-direction: column; gap: 0.5rem; text-decoration: none; min-width: 0; }
  .tile { display: grid; place-items: center; background: var(--tile); border-radius: 6px; padding: 0.9rem; aspect-ratio: 1 / 1; }
  .tile svg { width: 100%; max-width: 6.5rem; height: auto; overflow: visible; }

  .cm { font: 400 0.8125rem/1.5 var(--f-ui); color: var(--muted); }

  /* Reading */
  .back { display: inline-block; font: 600 0.9375rem/1.6 var(--f-ui); color: var(--muted); text-decoration: none; margin-top: 1.25rem; }

  .work-title { font: 400 clamp(1.9rem, 6.5vw, 2.75rem)/1.4 var(--f-display); margin: 0; text-wrap: balance; }

  .tools { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; font: 400 0.8125rem/1 var(--f-ui); color: var(--muted); }

  .pn a { text-decoration: none; max-width: 48%; min-width: 0; }
  .pn a:last-child:not(:first-child) { text-align: right; margin-left: auto; }
  .pn small { display: block; font: 400 0.8125rem/1.6 var(--f-ui); color: var(--muted); }
  .pn span { font: 400 1.125rem/1.6 var(--f-display); }
  .pn a:hover span { color: var(--accent); }

  /* Foreword */

  .verse { font: 400 calc(1.2rem * var(--scale))/2 var(--f-display); white-space: pre-line; margin: 0 0 1.3em 1.5rem; padding-left: 1rem; border-left: 2px solid var(--accent-soft); }
  .about { display: flex; flex-wrap: wrap; gap: 1.75rem; align-items: flex-start; margin-top: 1.25rem; }

  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 0.35rem 1.25rem; margin: 1.5rem 0 0; font: 400 0.9375rem/1.6 var(--f-ui); }
  .facts dt { color: var(--muted); } .facts dd { margin: 0; overflow-wrap: anywhere; }
  .bigcover { display: block; width: 100%; max-width: 20rem; height: auto; margin: 1.5rem 0 0; border-radius: 3px; box-shadow: 0 6px 22px rgba(0,0,0,.28); }
  .book { position: relative; width: min(15rem, 70%); margin: 1.5rem 0 0; transform: perspective(900px) rotateY(-12deg); transform-origin: left center; filter: drop-shadow(10px 14px 14px rgba(0,0,0,.35)); }
  .book img { display: block; width: 100%; height: auto; border-radius: 1px 5px 5px 1px; }

  .sh3 { font: 600 0.9375rem/1.6 var(--f-ui); color: var(--accent); margin: 2.25rem 0 0.25rem; }
  .st { font: 400 calc(1.125rem * var(--scale))/2 var(--f-body); max-width: 38rem; margin: 0 0 1.1em; text-wrap: pretty; }
  .stv { font: 400 calc(1.2rem * var(--scale))/2 var(--f-display); white-space: pre-line; margin: 0 0 1.4em 1rem; padding-left: 1rem; border-left: 2px solid var(--accent); }
  .snum { font: 400 1.5rem/1 var(--f-display); color: var(--accent); margin: 2rem 0 0.75rem; }
  .list .ti { flex: none; width: 3.25rem; padding: 0.35rem; align-self: center; } .list .row { display: flex; align-items: center; gap: 0.9rem; min-width: 0; flex: 1; }
  .lock { border: 1px solid var(--rule); background: var(--tile); border-radius: 6px; padding: 1.25rem; margin: 1.5rem 0; font: 400 0.9375rem/1.7 var(--f-ui); } .lock input { font: inherit; padding: 0.55rem 0.7rem; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 0; margin-right: 0.5rem; max-width: 100%; } .lock button { font: 600 0.9375rem var(--f-ui); padding: 0.55rem 1rem; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 0; cursor: pointer; } .lock .err { color: var(--accent); margin: 0.5rem 0 0; }
  .more-card { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 2.5rem; padding: 1rem 1.1rem; border: 2px solid var(--ink); text-decoration: none; color: var(--ink); } .more-card strong { display: block; font: 400 1.25rem/1.6 var(--f-display); } .more-card small { font: 400 0.8125rem/1.6 var(--f-ui); color: var(--muted); } .more-card:hover { border-color: var(--accent); }

  .le { display: block; font: 400 0.8125rem/1.5 var(--f-ui); color: var(--muted); }
  .soc { margin: 2rem 0 1rem; border-top: 3px solid var(--ink); padding-top: 1rem; font: 400 0.9375rem/1.7 var(--f-ui); }

  .soc .vw { color: var(--muted); font-size: 0.8125rem; }
  .stars { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem; margin: 0.5rem 0 1rem; }
  .stars button { border: 0; background: transparent; font-size: 1.75rem; line-height: 1; padding: 0.15rem 0.25rem; color: var(--rule); }

  .ph { margin: 0 0 1.5rem; } .ph img { display: block; width: 100%; height: auto; border: 1px solid var(--rule); } .ph figcaption { font: 400 0.8125rem/1.6 var(--f-ui); color: var(--muted); margin-top: 0.4rem; }

  .list { list-style: none; margin: 1.25rem 0 0; padding: 0; border-top: 1px solid var(--rule); }
  .list a { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding: 0.9rem 0; border-bottom: 1px solid var(--rule); text-decoration: none; }
  .list .lt { font: 400 1.25rem/1.6 var(--f-display); min-width: 0; overflow-wrap: anywhere; }
  .list .lm { flex: none; font: 400 0.8125rem/1.6 var(--f-ui); color: var(--muted); }
  .list a:hover .lt { color: var(--accent); }

  /* tab bar with icons, scrolls sideways on phones */

<script>
(function () {
  var POEMS = [{"t":"விடியல்","p":1,"b":"விளக்கொளியில்\nவிளையாடும்\nவிட்டில் பூச்சி\nவிடியலை\nவேண்டாம் என்கிறது\n\nஇவளோ\nவிடியலுக்காய்\nவிரதம் இருக்கிறாள்\n\nஅந்தி சாய்ந்ததும்\nஆசைகள் பலவுடன்\nவாசலில் காத்திருக்கும்\nவாடகைக் கணவன்\n\nசெல்வம் குறையா\nஅவள் வீட்டில்\nதினம் தோறும்\nதாலி இல்லா\nமுதலிரவுகள்\n\nவிரசம் தணிந்ததும்\nவிரக்தியில் மூடிக்கொள்ளும்\nஆடையில்லா மேனியின் காயங்கள்\nஆயிரம் கதை சொல்லும்\n\nநாணம் மிஞ்ச அவளை\nநயந்தவன்\nநாளை\nவேசி என்று\nவேறு பக்கம்\nதிரும்பி செல்வான்\n\nதடம் மாறினும்\nதடையாய் அங்கே\nஅவள்\nதுகில் உரிய காத்திருக்கும்\nநாளைய துச்சாதனன்கள்\n\nஅவளுக்காய்\nஅங்கு\nகண்ணனும் வரப்போவதில்லை\n\nவிடியலுடன் பிறக்கிறாள்\nஅவள்\nஇன்னோர் இரவுக்காய்"},{"t":"அவள்","p":3,"b":"வெள்ளிக்கம்பிகளிடையே\nஎட்டிப்பார்க்கும்\nஓரிரு கறுப்பு நூலிழைகள்\n\nமுதுமையின் சுருக்கமும் கூடவே\nமூப்பின் அலுப்பும்\n\nஅவளின் ஆடையில்\nஅத்தனை கிழிசல்கள்\nஅதில் ஆபாசம் ஏதுமில்லை\n\nதேய்ந்து போன இறப்பர் செருப்பும்\nதேரென ஒரு தள்ளு வண்டியும்\nகூடப்பிறந்த உடன் பிறப்புக்களாய்\n\nகருங் காக்கைகளின் காவொலி\nகாண்டாமணியாய் அவளை வரவேற்கும்\n\nமுன்னுதித்து பின்னுறங்கும் அவள்\nநம் முற்போக்கு சமுதாயம்\nபிற்படுத்தியோரின் பிரதிநிதி\n\nமுன்னெதிரே தோன்றின்\nமுகத்தை திருப்பிடும்\nமூடச்சாத்திர மனிதர்களே\n\nஅவள்\nஅழுக்குழலும் இவ்வுலகின்\nதூய்மையின் சக்தி.!"},{"t":"மகள்","p":5,"b":"என் மனதினில் மலர்ந்தும்\nமடியினில் தவழ்ந்திடாத\nமகளுக்கு ஒரு மடல்\n\nசெல்லமகளே\nஉன் சிவந்த பாதங்கள்\nபடுமிடமெல்லாம்\nசெம்மண்ணாய் மாற வேண்டும்\nசேறாக அல்ல\n\nவளரும் பிராயத்தில்\nவகுப்பறைக் கல்வியுடன்\nவரையறை காணாதே\nவாழ்க்கைப் பாடத்தையும்\nசேர்ந்தே கல்\n\nதாய்மொழி பேசு\nதமிழ்மொழியாம் அதை வளர்த்திடு\nஅறிவுக்காய் ஆங்கிலம் பயில்\nஅதனைத் தாண்டியும் பலதும் பயில்\n\nஆனால் அவைக்குள்\nஅடங்கிப் போகாதே\n\nமுத்துக்குவியலுக்குள்\nதங்கக் கட்டி என\nஉன் தமிழும்\nமிளிரட்டும்\n\nசாத்திரம் கற்றிடு\nசரித்திரமும் கற்றிடு\nஆத்திரங்கள் வரும் பலர் மீது\nஅள்ளித்தெளி அவற்றை\nஉன் ஆக்கங்களில்\n\nவேண்டிய துறையை\nதேர்ந்தெடு\nவேண்டாம் என்றிடலாம்\nநானும் நாளை\nவேண்டாத பேச்சு என\nவெட்டி எறி!\nவென்று காட்டு!\n\nகனலிலே குதித்து\nகணவன் அவன்\nகவலை போக்கியவளையும்\n\nகாமத்தால் சோரம் போனவனை\nகட்டிய கணவன் என்று\nகைகளில் ஏந்தியவளையும்\n\nகற்பிற்கிலக்கணம்\nகன்னியர் நாயகம்\nஎன்றிடும்\nகயவர் கூட்டம்\n\nகாறி உமிழ்ந்திடு\n\nஉனக்கு வழி காட்ட\nஓராயிரம் உத்தமிகளின்\nகாலடித் தடங்கள்\nகாத்து நிற்கின்றன\n\nஆளுமை வேண்டுமா?\nஇந்திராவைப் பார்\nஅடக்கியவர்களை ஒடுக்க வேண்டுமா?\nபூலான் தேவி\nபுன்னகைத்து நிற்கிறாள்\n\nபோதாது என்கிறாயா?\n\nபுதிய தடம் அமைத்து\nபோரிடு\nஉன்னையும் சிலர் தொடரட்டும்\n\nசாதி…\nசாத்தானின் வேதம் என்றே பாடு\nஒன்றே குலம் என்று உறுதிபட கூறு\nசமத்துவம் உதிக்கும் வரை\nசத்தமிட்டு யுத்தம் செய்\n\nமதத்தின் பெயரால்\nமனிதத்தை மறக்காதே\nபரம் பொருள் உண்டனின் அது\nமுழு பாரினிற்கும் ஒன்றாமென கொண்டாடு\nமதத்தை தொலைக்கலாம்\nமனிதத்தை தொலைத்திடாதே\n\nகாமுகர்களின் கூடாரமம்மா இந்த உலகம்\nகாத்துக்கொள்ள\nகலைகள் சிலதை கற்றுக்கொள்\nகாக்க வேண்டியது\nஉன்னை மட்டும் அல்ல\nஉன் போன்ற பல சகோதரிகளையும் தான்\n\nஆடையில் குறை என்று\nமேடையிட்டு பொங்குவர்\nகலாசாரப் பாதுகாவலர்கள்\nஐயமா?\nஉன்னையே கேட்டுக்கொள்\nஉன் பகுத்தறிவு பதில் கூறிடும்\n\nஆரிடத்திலும் ஆசை கொள்\nஆனால்\nஆய்ந்து கொள்\nஆழம் பார்க்காது\nகாலை விட்டவனின்\nஅவசர துடுப்புதான்\nஇன்றைய பெருந்தொகை\n‘இரத்துக்கள்’\nஅதையும் நினைவில் கொள்\n\nவயதும் தாண்டும்\nமுதுமையும் தோன்றும்\nஅன்று\nஉன் மக்களுக்கும்\nஇவற்றையே உபதேசி\n\nநாளை மரணம் என்று\nநாள் குறித்தாலும்\nநலிந்துவிடாதே\n\nஇன்று எனது என்று\nஎழுந்து நின்று வேலை செய்\n\nஇமயத்தில் நீ\nகொடி நாட்டினாலும் - உன்\nஇதயத்தில் ஒரிடம் கொடுத்து விடு\nஇந்த தந்தைக்கு\n\nஅது போதும்…."},{"t":"காதலன்","p":11,"b":"காலைக்கதிரவன்\nகாதல் மிகுதியில்\nவாரியணைக்கையில்\nஅவன்\nவெம்மைத் தழுவலில் அயர்வுற்று\nவிலகி ஓடிய\nவெண் புரவிகள்\nஅவள்\nகாலடித் தடம் கண்ட\nகரைமணலில்\nஇதழ் பதித்து\nஇதம் காணும்\n\nஅவள்\nமேனியழகில்\nமோகம் கண்ட\nமுழுநிலவும்\nமேகக் கூட்டங்களில்\nமறைந்திருந்து அவளை\nமேவி நோக்கும்\n\nஅவள்\nகூந்தல் இடுக்குகளின்\nஊடு செல்லும்\nகுளிர்காற்று-தூரத்து\nகுயில்களின் கானம்\nதனை மறக்கடிக்கும்\n\nஇயற்கையின் அங்கமாய்\nஅவளை இரசிக்கின்றேன் நானும்\n\nஅவள்\nகற்பனைக்கெட்டாத\nகாதலனாய்"},{"t":"நண்பன்","p":13,"b":"இதயச்சுரங்கத்தில்\nஇன்பச்சிறை கொண்டு\nநினைவுகளில் நிலைத்திடும்\nநான்கெழுத்து வேதமவன்\n\nஉள்ளக்கிடங்கிலிருந்து\nஉணர்ச்சிப்பிரவாகம்\nவெள்ளமென பாய்கையில்\nவேகத்தடையிடுவான்-உன்\nவேதனையிலோ\nவெகுண்டெழுவான்\n\nவெட்ட வெட்ட\nவளரும் மரமென\nவெற்றுச்சண்டைகளில் மேலும்\nவேர்விட்டு நிலைத்திடுவான்\n\nதொட்டிலில் இட்ட\nதாய்மையும்\nதொடுதூரம்தான் வரும்\nஅவனோ உன்னை\nதொடுவானம்\nகூட்டிச்செல்வான்\n\nதவறுகளைக் சுட்டிக்காட்டி\nதடம் மாற்றும்\nஇன்னொரு\nதகப்பனவன்\n\nஅவனிடம்\nபோட்டிகள் கூட போலியாய் மாறும்\nவார்த்தைகளும் புதுவண்ணம் பெறும்\nமௌனங்கள் கூட அர்த்தங்கள் தரும்\n\nபேதங்கள் எனும்\nபேதைமை இல்லா\nமேதைமை உலகிற்கு\nஇட்டுச்செல்வான்\nஅங்கே பணம் கூட\nசெல்லாக்காசு\nபாசம் மட்டுமே\nபண்டமாற்று\n\nஉன்\nஉள்ளத்தில் ஒளித்திட்ட\nஅந்தரங்கப் பெட்டியின்\nமாற்றுச் சாவியை\nமறைத்து வைப்பவன்\nமறந்து இருப்பவன்\n\nகாதலும்\nகாமமும்\nகற்பித்திட்ட\nகல்லூரி கூட அவன்தானே\n\nஉதிரத்தால்\nஉறவில்லாதவன்\nஉணர்வுகளால்\nஉடன்பிறப்பாவான்\n\nமரணமும் ஜெயித்திட -அவன்\nமழையில் முளைத்த காளானல்ல\nமலரின் மகரந்தம்\nமலர்ந்து\nகனிந்து\nவிதையாகி முளைத்திட்ட\nநிலையான மரம்\n\nகாலத்தாலும்\nகலையாது\nஉன்னைச் செதுக்கிடும்\nஅந்த சிற்பி\n‘நண்பன்’"},{"t":"தேவதை","p":16,"b":"வான்வெளி தேவதை அவள்\nவாசல் தேடி வந்து\nகாலடித்தடம் பதிக்க\nகாத்திருந்தேன் நான்\n\nசித்திரை பிறந்துவிட்டால்\nசிங்காரமிட்டு திரியும்\nஎம்மவர் செல்லக்குழந்தை\nஅவள்\n\nஉதயசூரியனின் தரிசனம் கண்டு\nஉல்லாசம் கொள்வாள் - அவள்\nஉவகைப்பெருக்கிற்கு\nஉவமானம் ஏதுமில்லை\n\nஅவள் குரலோசை முன்\nகுழலோசையும் தோற்றுப்போகும்\nஅவள் செந்நிற விழிகளை\nசெழுந்தீயும் ஏங்கிப்பார்க்கும்\n\nஇப்பேயுரு நீங்கி\nஅப்பேட்டுரு கொண்டு\nஇன்னிசை பாடி\nஇனித்திருக்க ஏங்கும்\nபாரதியின்\nஇன்னோர் தாசன் நான்"},{"t":"உற்றவள்","p":18,"b":"சாளரம் வழியே\nசற்றே நோக்குகிறேன்\n\nஆயிரத்தில்\nஒருத்தி என\nஅங்கே அவள்\n\nஎன்\nஆசை நாயகிகளுக்கு\nநடுவில்\n\nசுட்டுவிரல்\nதொட்டவுடன்\nஉற்றவள் என\nஉணர்ந்திட\n\nஅங்கோ\nமணப்பெண்\nசந்தையில்\nஅவளை\nகவர்ந்திட\nகாத்திருந்தது\nஓர் கூட்டம்\n\nதாமதத்தை\nதகர்த்தெறிந்து\nஅவள்\nமுகத்தில்\nகன்னம்\nபதித்தேன்\n‘உரிமைக்கென’\n\nஅவள்\nசுகந்தம்\nராஜபோதை\n\nஅவள்\nகாகித உடலையும்\nகறுப்பு வெள்ளை உயிரையும்\nபத்திரமாகப்\nபையில் இட\n\nஎதிரே\n\nஇன்னொருத்தி\nகிறங்கி விட்டேன்"},{"t":"கனவில் ஒரு நாள்","p":20,"b":"கனவில் ஒரு நாள் யாரோ\nகற்பனைச்சாரலை அள்ளித் தெளித்திட\n\nவானமோ வசப்பட்டது\nவால்வெள்ளி எனவே வீறு கொண்டோம்\nபால்வீதி தாண்டியும் பயணம் செய்தோம்\nஅங்கும்\nபகுத்தறிவு சாரத்தை உரக்கச் சொன்னோம்\n\nமேடும் பள்ளமும் சமன் செய்தே - புவி\nமேவிய மக்கள் களிப்புற்று நின்றார்\nசாதியம் ஒழிந்தது என்றே\nசங்கூதி மாந்தர் சந்தோஷம் கொண்டார்\n\nபுத்த பூர்ணிமாவிலோ எங்கள்\nபுரந்தரர் கீர்த்தனைகள்\nஈகைத்திருநாளில் நினைவில்\nஇயேசுவின் தியாகங்களும்\n\nபசியோ எமக்கில்லை - எம்முள்\nபட்டினி என்றே ஒரு சொல்லில்லை\nஉருசிக்கு உணவறியோம் - உடல்\nஉறுதியே உண்மை என்று சொல்வோம்\n\nநங்கையர் நகர்வலம் நடுநிசியில் -இங்கு\nநாய்கள் கூட அவர் துணையில்லை\nஅன்னை சகோதரி அவள் என்றே\nஆராதிக்குது பேராண்மை இங்கே\n\nஆசை முத்தம் தருது ஒரு குழந்தை\nஆசிபாக்கள் இனி யாருமில்லை என்று\nபேச்சி அவள் வாய்மொழி கேட்டு\nபேரின்பம் பிறக்குது இங்கு\n\nகனவு கற்பனை என்று சொன்னாலும்\nநித்தியம் காண்கின் நிதர்சனம் ஆகும்\nநித்திலம் எனவே இந்நிலம் செழிக்கும்\nநிச்சயம் ஒரு நாள் - இது சத்தியம்\n\nஅதுவரை\nகனவுகளுடன்\nநான்\nநாம்"},{"t":"கனவு","p":22,"b":"காலங்கள் கடந்தாலும்\nகாவியங்கள் மறைந்தாலும் -என்\nகற்பனையில் கலையாத\nகனவுத்தேவதையவள்\n\nஅவள்\nகூந்தல் கருமை கண்டு\nகுயிலும் வேறுவரம் வேண்டும்\nஅவள்\nவெற்றுப்புன்னகைகளும்\nநான்முகனின் வேதம் படிக்கும்\n\nமழைமேகம் இறங்கிய\nமணித்துளிகள் -அவள்\nகன்னக்குழிச்சிப்பியில்\nகாத்திருக்கும் முத்தாக\n\nசிதறிய முத்தை\nசீண்ட கரம் நீட்டினேன்\nகலைந்தது என் கனவு"},{"t":"காதல்","p":23,"b":"உடல் தீண்டும் முன்னே\nஉளம் தீண்டி\nஉயிர் தீண்டும்\n\nமலர் தீண்டும் வண்டின்\nமனம் தீண்டி\nமது தீண்டும் வண்ணம்\nமறந்திடச் செய்யும்\n\nமானுடச்செழுமையின்\nஇளந்தளிர்மையே\n\nதுவண்டிட்ட நெஞ்சத்தில்\nதுளிர்விட்டாய்- உன்\nஇளம் அரும்புகள்\nஎனை ஊன்ற….\nபற்றிக்கொண்டேன்.\n\nகொண்ட பற்றுதல்\nகொள்ளையின்பம்\nஇன்பமோ….தேன்மழை"},{"t":"நரகம்","p":24,"b":"புலர்ந்த வானம்\nபொன் வெயில் நேரம்\nஅலர்ந்த மலர்கள் - நீர்\nஅருந்தும் பட்சிகள்\n\nவிளைந்த வயல்களில்\nவளைந்தோடும் நீரோடை\nதெளிந்த நீரில்\nமுகம் பார்க்கும் சிறு தும்பி\n\nகதிரவன் வரும் முன்னேயுதித்து\nகலங்களில் நீரெடுக்கும்\nகன்னியர் கூட்டம்\n\nஅடடே\nநகரம் எனும் நரகம்\nநசித்து விட்ட\nநல்வாழ்க்கையன்றோ இது\n\nகண்ணீருடன்\nகாதலன் நான்"},{"t":"சொர்க்கம்","p":25,"b":"விதையின் கண் முளைத்த மரமும்\nவிண் நோக்கி பார்த்திடுகையில்\nகரை படரும் கடலமுதே உன்\nகாதலும் நிலைத்திடுமோ\n\nஇமை மூடும் நேரம்\nஇதழ் தந்திடும்\nஇதம் வேண்டி நீயும்\nஇச்சையில் முத்தமும் தந்திட\n\nஉன்\nமுத்த அலைகளில்\nமூர்ச்சை அடைந்து\nநிலமகளும்\nகண நேர ஓய்வுக்காய்\nகாத்திருப்பாள்\n\nகாதலின் வன்மையும்\nகாத்திருப்பின் வெம்மையும்\nஒருசேர\nதாபத்துடன் ஓடிவரும் உன்னை\nதடுத்திட நினைத்திடும்\nசில பிஞ்சுப்பாதங்கள்\n\nநிலமகளும்\nநன்றியாய் அவைகளை\nநெஞ்சினில்\nபுதைத்துக்கொள்ள\n\nமறிகடல்\nகாதலும்\nஅங்கு\nமறைந்திடும்\n\nமலர்ந்திடும்\nஒரு\nபுது சொர்க்கம்"},{"t":"பேச்சரவம் கேட்டிலையோ?","p":27,"b":"ஏன் இப்படி செய்கிறாய்?\nஎன\nஅதட்டுகிறது\nஅக்குரல்\n\nஎழுதாதே என\nகட்டளை இடுகிறான்\n\nஎதிர்த்து\nஎழுதுகிறேன்\n\nஇன்றேனும்\nஅவன்\nசுயரூபம்\nவெளிப்படட்டும்\n\nஎன்\nதனிமையின்\nதோழன்\nஅவன்\n\nஅவனே\nஎன்\nதூக்கத்தையும்\nகெடுப்பவன்\n\nவிரசங்களை\nவினயமாக\nஎன்னுள்\nபுகுத்துவான்\n\nஅவன்\nதாராளவதி\nபழைமைவாதி\nவெகுசன விரோதி\n\nகட்சிகளை மாற்றி\nஎன்னை\nகலங்கடிப்பான்\n\nஎனை மறந்தவேளையில்\nஏதேனும்\nஉளறிடுவான்\n\nஅநேக சங்கடங்கள்\n\nஇப்போது கூட\nஎன்னோடு\nபேச்சுவார்த்தை\nநடாத்துகிறான்\n\nநாங்கள்\nபேசிக்கொள்கிறோம்\n\nஒரே குரலில்\n\nஎங்கள்\nபேச்சரவம்\nகேட்டிலையோ…?"},{"t":"அறிந்தும் அறிந்திடா…","p":30,"b":"ஹார்மோன்களின்\nஆர்ப்பரிப்பில்\nதுள்ளிக்குதிக்கிறது\nஇரு தேகங்கள்\n\nமனத்திலோ\nகாதல்\nமதயானையென\n\nஊடல்கள் மறைந்த\nகூடற் பொழுதென\nகாலமும் கைகாட்டுகிறது\n\nஆரத்தழுவலில்\nஆரம்பிக்கிறது\nமனிதன்\nஅறிந்தும்\nஅறிந்திடா\nஅவ்விரகசியம்\n\nஇதழ் பட்ட\nஇடமெல்லாம்\nதுளிர்த்திடும்\nவேர்வைத் துளிகள்\n\nவருடல்களில்\nவறட்சி வேண்டாமென\n\nநிசப்த பெருவெளியின்\nசப்த குவியல்கள்\nசங்கேத பாஷைகளாய்\n\nகாற்றுக்கும்\nவெளியில்லா\nஅவ்வெளியில்\nகாதலுக்கு மட்டும்\nஇரு கட்சிப்பணி\n\nசாலமும் துறக்கையில்\nஞாலமும் மறக்கிறது\n\nபுலனைந்தும்\nபொறியைந்தில்\nபுதைந்து போக\n\nகாலமும்\nகாணாமல் போகிறது\nஅங்கு"},{"t":"வதந்தி","p":32,"b":"வதந்திச் சவால் ஒன்று\nவாட்ஸ் ஆப்பில்\nஉலா வந்தது\n\nஎனக்கோ\nபதில்கள்\nவரவில்லை\n\nஉருவாகவில்லை\nஉருவாக்குவோருமில்லை\n\nஎனக்கென\nவதந்தியொன்றை\nவரைந்து\nவண்ணந்தீட்டி\nவலம் வர செய்ய\nமுன்\n\nபுதிதாய்\nஇன்றொருவனின்\nவதந்தி\n\nகாட்டுத்தீ முன்\nதீப்பொறி நிற்காது\n\nமுறை வரும்\nகாத்திருப்போம்"},{"t":"இழைத்த பெரும்பிழை","p":33,"b":"கடற்கரை மணலில்\nகலையாது நிற்கின்றன\nஅவள் காலடித் தடங்கள்\n\nஅலைகளே\nஅணை கட்ட வையாதீர்\nஅவள்\nபாதமணலை\nபூசிக்க\nயாசிக்கிறேன்\n\nஅருகிலேயே இருந்தவள்\nஅகன்று போகிறாள்\nஅழுகையோடு\n\nகாற்றே\nநீயும் தூது சென்று\nஅவள் கண்ணீரை\nகாயச் செய்து விடு\nகாணப் பொறுக்கவில்லை\n\nஆகாயமே\nநீயும்\nஅவள் ஆதரவுக்கட்சியா\nஆதவனை விரைவில்\nஅந்தி சாய செய்வதேன்\n\nதோள்களில் சாய்ந்த போதே\nதோழமையும் தொலைந்ததே\nதோழன் எனக்கூறி என்னை\nதொலைதூரம் வைப்பதேன் ?\n\nஅவள்\nவிழிகளில் ஒளிந்திருந்த\nமின்மினிகள் என்னுள்\nமின்னலாயப் பாய்ந்ததை\nஉணர்ந்ததில்லையா அவள்\n\nநாடகம் செய்கிறாள்\nமனதில் இல்லாமலா\nமணிக்கணக்கில் உடனிருந்தாள்\n\nவாயசைவில்\nவார்த்தைகள் தொலையவே\nஇதழ்கள் பதிந்தன\n\nஇமைக்கா பெரும் நொடியில்\nஇதயங்கள் இணைந்த பின்\nஇழைத்ததும் பெரும் தவறா ?\n\nஇல்லை\nஎன்றவாறு\nஇணைந்தது ஒரு கரம்"},{"t":"மறுபடியும்","p":35,"b":"காலநிலை மாறவில்லை\nகாற்று தீரவில்லை\nவால்வெள்ளி வீழவில்லை\nவானம் பொய்க்கவில்லை\n\nஆனால் வாழ்வு\nபொய்த்துப்போனது\nமறுபடியும்\n\nஎரிகுண்டுகள் பாயவில்லை\nஎரிமலைகள் வெடிக்கவில்லை\nசுனாமிகள் எழவில்லை\nசுழற்காற்று வீசவில்லை\n\nஆனால் மரண ஓலங்கள்\nமறுபடியும்\n\nபயங்கரவாதம் இல்லை\nபடைவீரர் புரட்சிகள் இல்லை\nநாஜிக்களின் நடமாட்டம் இல்லை\nநாடுகளிடை போர்களும் இல்லை\n\nஆனால் வீட்டுச்சிறைகளில்\nமறுபடியும்\n\nசம்பவங்கள் மாறினும்\nசரித்திரமோ மறுபடியும்"},{"t":"வருங்காலம்","p":36,"b":"கால வெள்ளத்தில்\nகற்பனை படகொன்றை\nஓட விடுகின்றேன்\n\nஅது\nமிதந்து\nநகர்ந்து\nபோக்கிடம் வேறின்றி\nபுகுந்தது ஓரிடம்\n\nகாலத்தின் படகுகளும்\nகரைதட்டிய காலமது\n\nஇயற்கையின் பசிக்கு\nஇரையான பாதி சனக்கூட்டம்\nமீதியில் வெகு பலர்\nவேற்றுக்கிரகம் புக\n\nமிஞ்சியவை புசித்தவை\nஎச்சிற் பண்டங்கள்\n\nகாடுகள் எரியவில்லை\nகாணாமல் போயின\nநாடுகளின் எல்லைகளோ\nநகரவில்லை இன்னமும்\n\nசிலிண்டர்கள் தீர்ந்ததும்\nமூச்சு விட இயலாது முனகுகிறார்கள்\nகாற்றும் கறுப்பாய் போனது\n\nமழை\nமண்ணைத் தொட முன்\nமறைந்து போகிறது\n\nகொள்கலன் மூலம்\nகுடிநீர் இறக்குமதி\nவேற்று கோள்களில் இருந்து\n\nஅரசியல் மேடைகள்\nஅப்படியே இருக்கின்றன\n\nகமியூனிசமும்\nகப்பிடலிசமும் சனநாயகர்களின்\nசட்டைப் பைகளை\nசத்தமின்றி\nநிரப்புகின்றன\n\nசெவ்வாய்க்கிரகத்தில்\nசாதிய சண்டை என\nபிந்திய செய்திகள்\n\nவடித்த கண்ணீரும்\nவறண்டுபோயிற்று"},{"t":"இசை","p":38,"b":"காற்றினில் கலந்து\nகாதினில் நுழைந்து\nகாதலாய் மாறிடும்\nஇசையே-உன்\nகர்த்தாவும் யார்தானோ\n\nகுடை தாண்டி பெய்யும்\nமழைச்சாரலே உன்\nஇசைத்தூறலில் நனைகையில்\nஎன் இளமையும் தன்னை புதுப்பித்துக்கொள்கிறது\n\nநவரசங்களையும்\nஅடங்கச் செய்யும் சிருங்காரமே\n\nஎன் சிந்தையில் நிலைத்திட்ட\nசெந்தமிழுக்கும்\nசெழுமை சேர்த்தாய்\n\nசேரிடம் எங்கும்\nஓர் மொழி நான் என\nஉணர்த்தி நின்றாய்\n\nஇயற்கையின்\nஇதயமே\n\nஅந்த\nஇறைவனின்\nநாடித்துடிப்பும்\nநீயானாதால்தானோ\nநாதமும்\nஒரு வேதமானது\n\nஇராகமும் அறியா\nதாளமும் அறியா\nபாமரர் நெஞ்சில்\nபடர்ந்தெழுகிறாய்-உன்\nபடர்க்கைக்காய் காத்திருக்கும்\nபித்தருக்கெல்லாம்\nபெரும் சித்தனும் ஆகிறாய்\n\nஏழு சுரங்களில்\nஅடங்கிப் போகிறாய்\nஎண்ணிலடங்கா ஆத்மாக்களை\nஏங்கச் செய்கிறாய்\n\nஎன் அழுகை முதல்\nசிரிப்பு வரை\nஅனைத்திலும்\nஅங்கமான இசையே\n\nஉன்னை\nஅடுத்த பொழுதிற்காய்\nஇரவல் வேண்டும்\nஏழையாய் நான்"},{"t":"அவன் வாழ்கின்றான்","p":41,"b":"கயிற்றை பிடித்தபடியே\nவிட்டத்தை அண்ணாந்து\nபார்த்தான்.\n\n“வா” என அழைப்பதாய்\nதோன்றியது\nஅவனுக்கு\n\nகண்களில் இருந்து\nகண்ணீர் தாரையாக\n\nஅவன் அழவில்லை\n\nஅழுவதற்கு காரணம்\nதேடினாலும் தெரியவில்லை\n\nதனிமையின் சுவர்கள்\nஅறைச்சுவரை காட்டிலும்\nவிசாலமானவை..\n\nஅடைத்திருக்கும் யன்னலூடாய்\nசிறுகீற்று வெளிச்சத்திற்காய்\nஏங்குகின்றான்\n\nஅந்த இருள்\nஏமாற்றத்தையே தந்தது\n\nவிடியல் வருமா?\nஅவன் நம்பவில்லை\n\nதூக்கம் தொலைந்துப் போன\nஇராத்திரிகளில் இதுவும் ஒன்று.\n\nதூக்கம் மறந்தும் போனது\n\nதோல்வி கண்ட வாழ்வில்\nஇறுதியாக ஒருமுறை\nதோற்றுவிட உறுதி கொண்டான்\n\nஎங்கிருந்தோ ஒரு அழைப்பு\nஅவன் குரல் கேட்க\nஅவன் குறை கேட்க\n\nஅன்றிரவு அவன் வாழ்ந்துவிட்டான்\nவிடியல் வந்தது\nஅன்று முதல் அவன் வாழ்கின்றான்\nவெற்றியாளனாய்"},{"t":"மனிதம்","p":43,"b":"கொரோனாவின்\nகொடுபிடியில்\nஉலகம்\n\nஅங்கே\nஎங்கே உன் இறைவன் என்று\nஏளனம் செய்யும் ஓர் கூட்டம்\n\nஅன்று\nசிரியப்போர்\nசிந்திய இரத்தம் கண்டு\nசிந்தை மாறாதவன்\n\nஅன்று\nஆசிபா என்னும்\nஅறியா குழந்தையின்\nமழலை குரல் அலறல் கேட்டு\nமனமிறங்காதவன்\n\nதினமும்\nபுசிக்க உணவின்றி\nபுலம்பும் மக்களை\nபுறந்தள்ளியவன்\n\nஉங்கள் கூக்குரல்களுக்கு மட்டும்\nசெவிசாய்க்கப்போகிறானா?\n\nமரத்தை நட்டவன்\nதண்ணீர் ஊற்றலாம்\nமுகில் கொண்டு\nவெயிலை மறைக்கப்போவதில்லை\nஅண்டை மரம் தான்\nநிழல் கொடுக்கும்\n\nஅதுபோல\nநமக்கும்\nமனிதம் தான்\nகரம் கொடுக்கும்\n\nமனிதத்தை\nமனதினில் இருத்துங்கள்\n\nகற்கோவில்கள் பின்\nதேவை இல்லை\n\nஅங்கே\nகடவுளாய்\nநாம் இருப்போம்"},{"t":"இறைவன்","p":45,"b":"மதத்திற்கும் சாதிக்கும்\nமாலையிட்டு\nமாற்றான் நிலம் கவர\nமறம் சமைத்து\nஉடைமை இழந்து\nஉரிமையும் இழந்த\nஎன் குமரித்தமிழா\n\nவாழ்ந்த பாதையும்\nவாழ்வின் பாதையும்\nகாகித புத்தகத்தின்\nகருகிய பக்கங்கள் ஆக\nகலங்கி நின்றேன்\n\nஇன்னல் நீங்க ஏது வழி என்றேன்\nஇடுக்கண் வருங்கால் சிரி என்றான்\nகாவிச்சாயம் பூசிய\nகருப்பன் வள்ளுவன்\n\nகாட்டாற்று வெள்ளமாய்\nகடந்து விட்ட என் வேதனைகளுக்கு\nவெற்றுப்புன்னகைகளால்\nவேலி கட்ட முடியவில்லை\n\nநந்தவன கோபியருடன் மகிழும்\nநவீன கண்ணனும்\nநகைக்கின்றான்\nநித்தியம் ஆனந்தம் என்று\nகைலாச துவாரகையில்\n\nவாசற்கோபுரத்தினைமட்டும்\nவணங்கி நின்றவனை\nவாயிற்படி தாண்ட செய்தது ….\nபகுத்தறிவு\nஅன்று\n\nபாசிசமோ\nஅதனுடன்\nபகடையாடுகிறது\nஇன்று\n\nபரமசிவனும் அங்கே வெறும்\nபார்வையாளனாய்\n\nமசூதிகளின் இருப்பிடங்கள்\nமயானங்களாய் மிளிர்கின்றன\nகூடவே ஆங்கொரு சிலை\n\nஇரத்த பாணங்களாய்\nஇராம பாணங்கள்\n\nகொழுந்து விட்டெரியும்\nதன் தேவாலயங்களை இரட்சிக்க\nஅந்த இறைவனுக்கு\nபிரார்த்தனைகள் கூட போதவில்லை\n\nசிரிய அகதிகள்\nசிந்திய இரத்தம்\nஅக்கினியென மாறி\nஅரண் இட்டிருக்க வேண்டாமா\n\nஅது ஏன்\nகண்ணகிக்கும்\nதிரௌபதிக்கும்\nஒரு பாரபட்சம்\n\nபுத்தனின் திருவடியில்\nபூத்த பல மலர்கள்\nமத்தியில் ஒரு செந்தாமரை\nகுருதியில் குளித்தனவோ என்று\nதமிழும் உவமானம் தேடட்டும்\n\nமதம்\nசாதி\nமொழி\nஇனம்\nஎன மற்போரிடும்\nமதயானைகள்\nமடிந்தழியட்டும\n\nஆனால்\nஅவற்றின் கால்களிடையே\nசிக்குண்டு\nசிதைந்திடும்\nசிற்றெறும்புகளின்\nகூக்குரலுக்கு தன்னும்\nஇறைவன் செவிசாய்த்திடகூடாதா?\n\nஅன்று\nஆசிபா\nஅழிக்கப்பட்டாள்\nஅந்த\nஆண்டவனின் இல்லத்தில்\n\nஅழுத பிள்ளைக்காய்\nஞானப்பால் தந்தவளும்\nஅவளுக்காக ஆஜராகவில்லை\n\nஆடு மேய்க்கும் சிறார்க்கு\nவானில் அற்புதம் புரிந்தவ n\nஒரு நாள் நான் போய்\nஅவர் நோய் தீர்ப்பேன்\n\nஅதுவரை காத்திருப்பார்\nஎன் ஊரில்\nஅவர் வீட்டில்\nஎனக்காய்\nஅவர்"},{"t":"மிஸ்","p":64,"b":"வட்ட சிறு பொட்டும்\nவகிடு பிரித்த கூந்தலும்\nவசீகரிக்கும் கண்களும்\nவிரிந்திட மறக்கா அப்புன்சிரிப்பும் - நானும்\nமறந்திடல் கூடுமோ\n\nமழலைக் குணம்\nமறையாது நின்றவனை\nமகன் என கொண்டவரின்\nஏகோபித்த உரிமைக்காய்\nஇறுமாப்பு கொள்கையில்\nஏளனம் செய்தனர்\n\nமுன்னும்\nபின்னும்\nஆயிரம் மகன்கள்\nஅவருக்காய்\n\nமடிந்த நாயிலும்\nமகோன்னதம் கண்டானம் ஒருவன்\n\nகற்பனை என்றவனுக்கு\nகாட்சியாய் நின்றது\nபெண்ணுரு போந்த\nஅத் தாய் சிவ சக்தி\n\nமுத்து முத்தான சித்திரம் என-தமிழ்\nமுத்தமிட்ட உம் இசைக்காய்\nபிறந்திடல் வேண்டும் இன்னொரு\nபிறவி\n\nஎன்\nகரம் பற்றி வரம் தந்த\nகடவுளாய் நீர் இருக்க\nகலைமகள் கூட\nவெறும் கற்சிலை தான்\n\nதமிழ் எனும்\nநிழல் தந்த\nநிதர்சனம்\n\nஉங்கள் நிஜப்பெயரும்\nநான் மறந்தேன்\n\nஅறிந்தும் பயனில்லை-என்\nஅகத்தில் படிந்தது\n\nநான்\nஅறியா நிலையிலும்\nஎன் உதடுகளில்\nஅழியாதது\n\nஅந்த\nஅந்தாதி\n\n‘சுதாகரன் மிஸ்’"},{"t":"தோழி","p":67,"b":"தோளுயர வளர்ந்த பின்\nபுதுத் தோழமை தந்திட்ட\nஎன் தோழிக்கு\n\nஅழகு தமிழ் கொண்டு\nநான் தரும்\nஅன்புப்பரிசு இது\n\nமாற்றம் காணா உன்\nமனதின் மத்தியில் எம்\nஉள்ளக்குழந்தைகளும்\nஓடி திரிந்தன\n\nதொலை தூர பயணங்களும் உன்\nதொடர்பின்றி\nஇனிப்பதில்லை\n\nஎம் தோழமையின்\nநடுவண் நீ\n\nகாகிதங்களில் உலவிய\nபெண்ணியத்தை\nகாட்சியாய் கண்டது\nஉன்னிடத்தில்\n\nகண்டிருப்பின்\nபாரதியும்\nகவிமழையில்\nஉன்னை\nநனைத்திருப்பான்\n\nஏக்கங்கள் நிறைந்த\nஇவ்வுலகில்\nநாளைக்காக நீ காட்டும்\nநம்பிக்கை\nநட்சத்திரங்களைக் காட்டிலும்\nபிரகாசமானது\n\nஉன்\nசாதனைகளைப் பதிவிட\nநாளைய சரித்திரமும்\nகாத்திருக்கிறது\n\nபேனா மையினால்\nஅந்த பக்கங்களை\nநிரப்பிடு\n\nஸ்டெதெஸ்கோப் மாட்டிய\nசெம்மை எழுத்தாளனாய்\n\nஅறுபதுகளிலும் இதே\nஆற்றலுடன் …\n\nஇன்று\nஇந்நாளில்\nஎட்டி கால் பதி\n\nஎன்றும் உன்\nஅன்புத் தோழனாய்\nநான்"},{"t":"அவன் தோழன்","p":70,"b":"என் எழுத்துக்கள்\nதோற்றுப்போகின்றன\n\nவரையறுக்க\nவலைவீசுகிறேன்\n\nஅவனோ\nநெடுங்கடலில்\nநீந்தியாடும்\nகெண்டை மீனென\n\nநட்பே\nகவசகுண்டலமாய்\n\nஇந்திரனும்\nஇரவல் பெற\nமுடியாதிங்கே\n\nஉண்மையை\nஉரக்கப் பறைபவன்\nசில சமயம்\nஉவர்ப்பையும்\nஉடன் தருவான்\n\nஉவர்ப்பிலும்\nஉன்னதம்\nஉண்டு\n\nவெள்ளைப்பூக்கள்\nநிறைந்த\nகருகமணி\nஅவன்\n\nசூடிக்கொள்ள\nதடையில்லை\n\nஆயிரம் மணிகளிடை\nவைரமாய்\nமிளிர்கிறான்\n\nஆயிரம்\nமணிகளிலும்\nஅவன்\nவிம்பம்\nஆங்காங்கே\n\nதோள் கொடுங்கள்\nஉயிரும் தருவான்\n\nஅவன்,\nதோழன்"},{"t":"இவன் இன்னொருவன்","p":72,"b":"ஆர்ப்பரிக்கும்\nஅலைகள்\nஎன்றும்\nஅவன்\nஅகத்தில்\nஎழுந்த வண்ணம்\n\nஅவனோ\nசலனங்களின்றி\nவெறுமையாக\n\nபுயலின் பின்னரான\nவெளிச்சத்தை\nஇரசிக்கின்றான்\n\nநாளை புயலுண்டு\nஎன\nஅறிந்தும்\nஅறியாதவாறு\n\nநிலையில்லா\nவாழ்க்கையில்\nஅவன்\nநொடிகள்\nநட்புக்காக\nமட்டும்\n\nஅதனில்\nபூக்களாக\nமலருங்கள்\n\nமுட்கள்\nஅவனுக்கு\nதேவையில்லை"},{"t":"அவர்கள்","p":74,"b":"நான்\nஇறுகப்பற்றிய\nசில சித்தாந்தங்கள்\nதளர்ந்து போயின\n\nகண்ணாடி வேலி\nஉடைய\nதொலைந்தது\nமாய விம்பம்\n\nநான்\nநானாகினேன்\n\nஎன் சோகங்கள்\nஎன் மாட்டில் தான்\nஎன எண்ணியிருந்தேன்\n\nஎன்\nஎண்ணங்கள்\nஇன்று\nஏளனம்\nசெய்கின்றன\n\nஇரசிக்க மறந்த\nமனிதர்களை\nஇரசிக்கின்றேன்\n\nஎன்\nஇரசனையும்\nஇன்று\nஇனிக்கிறது\n\nஎன்னுள் ஒட்டிய\nஇறுமாப்பு\nஇடம் தொலைகிறது\n\nஎன்\nமேதாவிலாசங்கள்\nபேதைமையின் நீட்சியாய்\nநிற்கின்றன\n\nநட்பை\nஅவர்களிடத்தே\nகற்கின்றேன்\n\nஅவர்களின்\nஅனுபவ\nமுதிர்ச்சி\nஎன்னை\nஅசரவும் செய்கிறது\n\nஅவர்கள்\nஅழகானவர்கள்\n\nஅவர்களுடன்\nஅனுபவமும்\nஅழகானது"},{"t":"திரு.விவேக் அவர்களுக்கு","p":77,"b":"விவேகானந்தா\nநீயோ துயில் கொள்கிறாய்\n\nசாதாரண நாட்களை விடவும்\nசற்றே வித்தியாசம்\nவிட்டுவிட்ட\nமூச்சுக்காற்றை\nஉள்ளிழுக்க\nமறந்துவிட்டாய்!\n\nநீ\nநட்டு வைத்த\nமரங்கள்\nஅதனை பறித்துக்கொண்டன\nபோலும்\n\nபாலசந்தரின் பட்டறை வைரமே!\nஇனி பகுத்தறிவு சினிமாவை எங்கு தேடுவேன்\n\nகொடுத்தது போதும் தமிழுலகுக்கு\nஎன்று நினைத்தாயோ\n\nதித்திக்கும் தேன்\nதெவிட்டியது போதும் என்று எவரேனும் சொல்வாரோ?\n\nதசரதன் போலும்\nஉன் தவிப்பால்\nஇன்று\nஅவனும்\nஉன்னை\nஅழைத்து விட்டான்\n\nசரி\nசெல்\nவிரைந்து செல்\nஉன் மகனைக் காண\n\nஅவனோடு\nஇங்கே மீண்டும்\nவந்துவிடு\nவிரைவில்\n\nஅதுவரை\nவிவேக் என்னும் அரியணை\nவெற்றிடமாக இருக்கும்"},{"t":"ரியூசன் சென்டர்","p":79,"b":"அந்த\nரியூசன் சென்டரின்\nமூலை வகுப்பறை அது\n\nஎரிக்கின்ற வெயிலில் இருந்து\nஎலுமிச்சை மரமும்\nஅந்த சிறுகூரையும்\nநிழல் தரும்\n\nஅடுத்த ஒரு மணிநேரத்திற்கான\nஆயத்தங்களுடன் நான்\n\nசொல்வதெழுதலுக்காய்\nசொற்களை\nமூளை அசை போடும்\n\nஅதிரினல்கள் இரண்டும்\nதம் வேலைகளை\nஆரம்பிக்கும்\n\nசகுனங்கள் பார்த்து\nஅதிர்ஷ்டத்திற்காய் பிரார்த்தித்த\nநாட்கள் அவை\n\nமுன்னெச்சரிக்கைகள் எல்லாம்\nவலுவிழந்த நாட்களும்\nஉண்டு\n\nஅப்போதெல்லாம்\nகாதுகள் கேட்கும் முன்\nகண்ணீர் வந்துவிடும்\n\nகைகுட்டைகளும் அதற்கு\nதயார் நிலையில்\n\nகாலங்கள் உருண்டோடியபின்\nகாயங்கள் இனிக்கின்றன\nகண்ணீர் சிந்துகிறேன்\nகாயத்தால் அல்ல\nஇனி\nகாணமுடியா ஏக்கத்தால்"},{"t":"வெள்ளவத்தை","p":81,"b":"ஓரெட்டு நிறைவில்\nமாற்றலாகி\nவந்த ஊர்\nபெயரோ\nமணல் பூமி என்கிறது\n\nஇன்று\nகண்காட்சிக்கென\nகடற்கரையில் மட்டும்\nமணல்\n\nமுருகண்டிக்கும்\nமுன்னே\nமுதல் வணக்கம்\nஎங்கள்\nவீசா பிள்ளையாருக்கு\n\nகூடவே\nபுறாக்கூண்டு\nபரோல் கைதிகளின்\nகதாசேபங்கள்\n\nதண்டவாள கரைகளில்\nதடக்கி விழுந்தாலும்\nதாங்கும் கரம்\nதமிழ் பேசும்\n\nஇங்கே\nபேரம் பேசத்தெரியாத\nகர்ண பரம்பரைகாரர்கள்\nஅதிகம்\n\nடச்சுக்கனல் அபத்தங்களை\nமறந்தவாறு\nவானுயர்\nகட்டிடங்கள்\n\nஎண்பத்து மூன்றின்\nஎச்சங்கள் ஓரிரண்டு\nஅவற்றை\nஅண்ணாந்து பார்க்கின்றன\n\n§\n\nஎல்லோருக்கும் இடம் ஈந்ததால்\nஇன்று\nஎள்ளளவுக்கு சில\nமரங்கள்\n\nவந்தேறு குடிகளின்\nதேசத்தின்\nநவீன\nவந்தேறிக்கு\n\nமூவெட்டு நிறைவிலும்\nமகிழ் சொர்க்கமாய்\n‘வெள்ளவத்தை’"},{"t":"தியேட்டருக்கு","p":84,"b":"முன்பள்ளிக்கால\nவயதது\n\nவீட்டில்\nஆரவாரம்\n\nதலைவாரி விட\nபவுடர் பூசிவிட\nஉடுப்பு போட்டுவிட\nஎன\nஎன்\nகுடும்பத்தில்\nஆட்களுக்கு மட்டும்\nபஞ்சமில்லை\n\nஅனைவரும்\nதயாராகும் முன்\nதூங்கிவிட்டேன்\n\nமுழித்தபோது\nஅம்மாவின்\nமடியில்\n\nகண்ணெதிரே\nவெள்ளைத்துணி\nவரி வரியாய்\nகதிரைகள்\n\nமுன்னுக்கும்\nபின்னுக்கும்\nசொல்லிப்பழகிய என்\nஉறவுகள்\n\nதிடீரென\nகும்மிருட்டு\n\nவெள்ளைத்துணியில்\nவண்ணக்காட்சிகள்\n\nசின்னப்பெட்டியில்\nபார்த்தது\nஇன்று\nபெரிதாக\n\n“மதுர” என்ற\nஅந்த எழுத்துக்களை\nவாசித்தது\nநினைவில் உண்டு\n\nதிடீரென\nகடதாசிகுப்பைகள்\nபறந்து என்மேல்\nவிழுந்தன\nநாயகன் வருகைக்கு\nஅந்த விசிற்சத்தம் என\nஎனக்குப்புரியவில்லை\n\nசுவரில்\nமாட்டியிருந்த\nமின்விசிறி\nபின்சீட்டு\nசிகரெட் புகையையும்\nமுகத்தில் அடித்தது\n\nபாதியில் அயர்ந்து\nஎழும்பிய போது\nபடம் முடிந்துவிட்டது\n\nஅடுத்த முறை\nநல்ல படத்திற்கு போவோம்\nஎன்றாள்\nஅக்கா\n\nஆண்டுகள் கழித்து\n“வேட்டைக்காரன்” பார்க்க\nகுடும்பத்துடன் போனோம்"},{"t":"பிறந்த நாள்","p":87,"b":"ஏன் நான் பிறந்தேன்\nஎன்ற எண்ணம்\nஏராளம் தடவை வந்து போயிருக்கிறது\n\nஎன் பிறந்த நாளில்\nமட்டும்\nஅவை\nகாணாமல்\nபோகின்றன\n\nஎங்கிருந்தோ\nஒரு இனம் புரியாக் கர்வம்\nஒட்டிக்கொள்கிறது\n\nஇதுவரை\nவாழ்ந்த நாட்களுக்கான\nவாழ்த்துக்களை\nஎதிர்பாக்கிறேன்\n\nவாழ்த்த மறந்தவர்களை\nமறக்காமல் குறிப்பெடு\nஎன\nமனதில் ஒரு குரல்\n\nவஞ்சம்\nதீர்க்கக்\nகாத்திருக்கிறது\n\nஅட்டைகள்\nதொடங்கி\nஅச்சடித்த வார்த்தைகள்\nவரை\nகண்டுவிட்டேன்\n\nஇன்னமும் ஆசையோ\nஓயவில்லை\n\nஇதுவரை\nமுகம் காணாதவரும்\nமுகநூலில் வாழ்த்துகின்றனர்\n\nஏதோ\nஏழாம்\nஜென்மத்து\nசொச்சம்\n\nபுதுச்சட்டை\nஅம்மாவின் முதல் வாழ்த்து\nஇவையெல்லாம்\nமீளவும் என்னைச்\nசிறுபிள்ளை\nஆக்குகின்றன\n\nஆசி வேண்டி\nஆண்டு தோறும்\nஇன்னார் நான் என்று\nஇறைவனுக்கு மீள் அறிமுகம்\n\nஎண்குணங்களில்\nமறதியும்\nஒன்று போலும்\n\nகாலை முதல் ஒலித்த\nஅழைப்பொலிகள்\nமாலையில்\nகுறைந்திட\nஒரு வெறுமை வருகிறது\n\nகடிகார முட்கள்\nநள்ளிரவைத் தாண்டுவதை\nபார்த்து கொண்டிருக்கிறேன்\n\nபிறந்த நாள் முடிகிறது\n\nஏன் பிறந்தாய்\nஎன நச்சரிக்கும்\nஅந்த எண்ணங்கள்\nஎங்கிருந்தோ\nமீண்டும்\nபுகுந்து விடுகின்றன\n\nஅடுத்த\nபிறந்த நாள் வரை\nவாடகை செலுத்தி விட்டு"},{"t":"பயணம்","p":91,"b":"இரு நாட்கள்\nஇயற்கையின் தேசத்தில் சங்கமம்\n\nஆளில்லா காட்டுக்குள்\nஅமைதியாயத் தொடரிப் பயணம்\n\nவீசும் தென்றல்\nபல விசித்திரங்களைப்\nபண்ணிச்சென்றது\n\nஅந்த காற்றையும்\nகாதலனாக்கி கொள்ளலாம்\n\nகடவுளுக்கும் கேட்டது போலும்\nகாட்சி விரிந்தது\nகாதலர்களின் பாய்ச்சலில்\n\nதொட்டுப் பறிக்கும்\nதேயிலைக்கொழுந்துகளின்\nதாய்மடிகள்\nஒட்டிச்சென்ற எம்மை\nஉரசி உறவாடி\nவிடைகொடுக்க\nவரவேற்ற\nஇறப்பர் தோட்டம்\n‘கூகிள்’உம் அறியா\nவழிகாட்டியது\n\nமலையருவியோ\nமயக்கம் தந்தது\nகாதல் மயக்கமும்\nகூடுவதால் என்னவோ - அது\nகாதலர்களின்\nபூமடி\n\nபேருந்துப் பயணமும்\nபெரும் தடாகத்திற்கு\nஇட்டு செல்ல\nஇடையில்\nகுளிர் தேசத்தில்\nஒரு\nகுளிர்களி விருந்து\n\nஇயற்கையோடிணைந்து\nஈருருளி பயணம்\nகாலமகள் இருள் கொள்ள\nகாற்றலையும் வெருட்சி கொள்ள\nஓடிய ஓட்டம்\nதனிக்கதை\n\nபசியை தீர்க்க\nபுசிக்க உணவு தந்தாள்\nஅன்ன பூரணி\n“அம்பாள்ஸ்”\n\nதங்குமிடம் சேர\nதனியாய் ஒரு குடிலில்\nஉடன் பிறவா இரட்டையருக்கு\nஒரு\nஉவகை விழா\n\nமறுநாள் மீண்டும்\nமலையருவி\nஇல்லை\nவானத்தின் அருவி\nவாரித்தெளித்தாள்\nவான்முகிலின்\nநீர்த்தாரைகளை\n\nஅருவியின் குளிர்மையில்\nஅட்டைகளும் எம்முடன்\nஒட்டிக்கொண்டாலும்\nகால்களிரண்டையும்\nகற்கள் பதம் பார்த்தாலும்\nசோகம் இன்றி\nசுகம் தந்தாள்\nகடலரசனின்\nகாதல்மகள்\n\nநிலவுச்சமவெளி\nகனவுச்சமவெளியென\nகானலாய் மாற\nகிடைத்தது\n‘ஜெட்ஸ்கி’\n\nவேகம் காட்டி\nவானம் ஈர்க்க\nஅலறலுடன்\nபறந்த\nஅட்டகாசப் பயணம்\n\nகனவுப்பயணமும்\nகாட்சிகளாய் நினைவில் சேர\nஇனி\nகடவுளின் தேசத்திற்கான\nகனவுகளுடன்\nநாங்கள்"},{"t":"சில கோபங்கள்","p":95,"b":"ஆறுவது சினம்\nஇது என்\nஆற்றாமையின் வெளிப்பாடு\n\nமுயன்று தோற்றுவிட்டேன்\nமுதுகெலும்பற்றவனாய்\n\nமுகத்துப்புன்னகை\nமுதுகுக்கேலிகள்\n\nதேவைப்பேச்சுக்கள்\nபின் மௌன நாடகம்\n\nநன்றிகள் ஏதுமில்லை\nநரிகள் நடுவினிலே\n\nஉதவி கேட்டேன்\nநினைத்த கைகள்\nநீளவில்லை\n\nஒடிந்து போய் இருக்கையில்\nவார்த்தை சொல்லவும்\nஅந்த வாய்கள் இல்லை\n\nஏன் எனக்கு\nஎன்ற கேள்வி\n\nஏன்\nஎனக்கு மட்டும்\nஎன முடிகிறது\n\nவிதைப்பதைதான்\nஅறுக்கலாம்\n\nஅன்பை விதைக்க\nமறந்தேனோ\nநானும்\n\nஅறிகிலேன்\nஇந்த\nஆறாச்சினம்\nஎன் மேல்"},{"t":"நெருஞ்சி முட்கள்","p":97,"b":"என் பள்ளிக்கால\nநரகதூதர்கள்\nஅவர்கள்\n\nஅந்த\nவகுப்பறை\nபால்கனியை தாண்டிடும்\nஏழு நொடிகளில்\nஇறப்பையும் முத்தமிடலாம்\n\nநான்\nபடிக்காது\nபெற்றிட்ட\nபட்டங்கள்\nஅந்த\nசில நொடிகளில்\nஎச்சிற்தூறல்களாய்\nவிழும்\n\nஇன்று\nஅவர்களின்\nநினைவுக்கூட்டின் ஏதோ\nமூலையில் நான்\n\nஎன்\nசுடுகாட்டு நினைவுகளின்\nபிணந்தின்னிகளாக\nதினந்தோறும்\nஅவர்கள்\n\nஎன் குமுறல்களுக்கு\nதக்கன பிழைத்தல் இது\nஎன\nஒற்றை வரியில்\nபதில் சொன்னோர் பலர்\n\nஎனில்\nநான் பிழைத்துவிட்டேன்\nஎன் மனம்\nமரித்து போயிற்று\n\nஎன்\nசப்பாத்துக்களில்\nநீங்கள்\nநின்று பாருங்கள்\n\nஇல்லை!\nஅவை\nஎனக்கு மட்டும் தான்\nபொருந்தும்\n\nஉங்கள் மகிழ்ச்சி விநாடிகள்\nஇன்றளவும்\nஎன்னுள் நெருஞ்சி முட்களாக\n\nநாளைய தலைமுறையிடம்\nஇந்த மலத்தை\nபூசி விடாதீர்கள்\n\nஅவர்கள் முன்னும்\nமுகமூடி அணிந்து\nஎன்னால்\nதள்ளிநிற்க தான்\nமுடியும்\n\nஎதிர்த்து பேச\nஎப்போதோ\nமறந்துவிட்டது"},{"t":"கத்திரிக்கோல்கள்","p":100,"b":"உன்னை\nவெறுப்பவர்களையும்\nநேசிக்க\nகற்றுக்கொள்\n\nநேசித்து\nவெறுத்து விட்டேன்\n\nசெங்கமலமென\nகம்பளம்\nவிரிக்கிறேன்\n\nசேறென\nமுகம் சுளிப்பது\nமுகத்திரையின்\nஉள்ளும்\nதெரிகிறது\n\nஎன்\nஅன்பிற்கு\nஅருகதையானவர்களா\n\nதாமரை இலை\nதண்ணீரென\nஇவ்வுறவிற்கு\nஎன்ன பெயர்\n\nபதில்\nதெரிந்தும்\nதெரியாதவாறு\nநெஞ்சம்\n\nகாலம்\nகட்டியம் கூறியும்\nகாதுகளை மூடிக்கொண்டேன்\n\nஇனி\nகண்களையும்\nகட்டிட முடியாது\n\nஉதிரிப்பூக்களே\nஉங்கள்\nஉணர்வுகளை\nவெளிப்படுத்திடுங்கள்\n\nஅறுநீர் பறவையென\nஅறுந்து\nபோய்விடுங்கள்\n\nஏனெனில்\nஎனக்கு\nகத்திரிக்கோல்களை\nகையாள தெரியாது"},{"t":"தனிமை","p":102,"b":"ஊர் கூடி\nதேரிழுக்கையில்\nநான் ஒருவன் மட்டும்\nதனித்திருக்க …\n\nகாற்றின் ஓசையைக் கூட\nகாதுகள் உணர்ந்திடும்\n\nஇதயத் துடிப்பொலி மட்டும்\nஎனக்கென துணையென\n\nதிருவிழாவில் தொலைந்திட்ட\nகுழந்தையென நான்\n\nதேடுவாரோ எவருமில்லை\n\nபேசிட வார்த்தைகள்\nதொக்கி நிற்கும்\n\nரசிகனென\nநிலைக்கண்ணாடி\n\nஏக்கத்தின் கதைகளை\nகண்கள் கூறிடும்\n\nஆனால் நானோ\nஅருவமென\nஅவர்கள் முன்னால்\n\nஎன்\nஉள்ளத்து\nஒப்பாரிகளுக்கு\nஒலி பிறக்கும்\nஒரு நாள்\n\nஆசையில் தான்\nபிறக்கவில்லை\nஅனுதாபத்திலேனும்\nபிறக்கட்டும்\n\nஅதுவரை\nகாத்திருப்புடன்\nநான்"},{"t":"விட்டுச்சென்ற பக்கங்கள்","p":104,"b":"தொலைந்து போன என்\nபதின்மம் தேடித்\nதோழமையுடன் பயணம்\n\nபுத்தகக் காடுகளில் நான்\nபுதைந்து போன காலமதில்\nவிட்டுச் சென்ற\nவாழ்வின் பக்கங்கள்\n\nஇன்று\nஇட்டு நிரப்புகிறேன்\nகாலம் கடந்தபோதும்\n\nவட்டம் தாண்டி\nவா என்றது\nநட்பு\n\nசிறகு முளைத்த\nசக்கரவாகமாய் நானும்\nதோகை மயில்களுடன்\n\nகாலக் கண்ணாடியில்\nகடிகார முட்கள்\n\nமாரி ஓய்ந்து விடும்\nமனம் ஓயாது\n\nதொடரும்"},{"t":"சொப்பனம்","p":106,"b":"வண்ணப்பச்சை அடித்த\nவகுப்பறையில் அமர்ந்த வண்ணம்\n\nஇறுதியாண்டு இறுதித்தவணை\nஎன்கிறேன்\nசலனங்கள் இல்லாதவாறு\n\nகரும்பலகையில்\nகவிதை எழுதும்\nசுதாகரன் டீச்சர்\n\nஇரண்டாவது வரிசையில்\nமுதல் மேசை மாணவனாய் நான்\n\nஅனைவரும் சிரிக்கிறோம்\nகதைக்கிறோம்\nஅளவளவாகிறோம்\n\nஹாலில் இருந்து\nடிவி சத்தம்\n\nகற்பனைகளுக்கு மட்டுமல்ல\nசொப்பனங்களுக்கும்\nகடிவாளம்\nஇல்லை"},{"t":"ஆசைதான்","p":107,"b":"என்\nகாலவிருட்சத்தின்\nவேர்நோக்கி\nஒரு பயணம்\n\nநாடி மானி மாட்டிய\nநான அதை இட்டு நிரப்பியது கொவிட். 2020இல் நான் கிறுக்கியது அதிகம். பொழுது போகாமையின் வெளிப்பாடா அல்லது அழுத்தி வைத்திருந்த உணர்ச்சிகளின் பிரவாகமா தெரியவில்லை. நிறைய எழுதினேன். ஆனால் எழுதிய எல்லாவற்றையும் என் பெயரில் வெளியிட ஒரு தயக்கம். நான் ஒரு மரபுக்கவிதை விசிறி. நான் இரசித்து படிக்கும் எழுத்தாளர்களும் பேச்சாளர்களும் கூட அவ்வகையே. எனவே புதுக்கவிதை என்ற பெயரில் தமிழை கொலை செய்கிறேனோ என்றொரு ஐயம். இது புதுக்கவிதையா என்றும் ஒரு ஐயம்.","அதனால் புனைபெயரில் சிறிதுகாலம் வெளியிட நினைத்து எனக்கு நானே சூடிய பெயர் - வேணு. அச்சுதனுக்கும் வேணுவுக்குமான ஒற்றுமையால் அத்தேர்வு. பிறிதெதும் சுவாரசிய தொடர்புகள் இல்லை","உனக்கென 4 பேர் இல்லையா என்று கேட்பார்கள். என் கவிதைக்கும் வழமையான விசிறிகள் குறைந்தது நால்வராச்சும் இருந்தார்கள். நன்றாக இருந்தது என்ற அவர்களின் வார்த்தைகள் ஊக்கியாக சில மாதங்களில் புனைபெயர் மறைந்து இயற்பெயரில் எழுத தொடங்கினேன். என் கிறுக்கல்கள் எல்லாம் கடற்கரை கிளிஞ்சல்கள் போல. ஒவ்வொன்றும் ஒவ்வொரு வடிவம், நிறம், அளவு அவற்றிற்கும் எனக்குமான தொடர்பு கடலுக்கும் கிளிஞ்சல்களுக்குமான பந்தம் போல். அழகானது, ஆழமானது. இதெல்லாம் என்ன கிறுக்கல் என வாசிக்கும் போது எண்ணக்கூடும் சிலர். நானும் இப்போது வாசிக்கையில் சில இடங்களில் அப்படி நினைத்ததுண்டு. நினைத்திருந்தால் மாற்றி எழுதியிருக்கலாம். ஆனால் மாற்றவில்லை. இருபதுகளின் ஆரம்பத்தில் தடுமாறி தத்தளித்த இளைஞனின் உளக்குமுறல்கள் இவை. துக்கம், சந்தோஷம், கோபம், ஆசை, மடைமை என அனைத்தினதும் குலவை ஒலி இவை. அப்படியே விடுவதே சிறந்தது.","இதை புத்தகமாக்கி என்னுடன் பத்திரமாக்கி வைக்கும் எண்ணம் நெடுநாளையது. அதை ஆரம்பித்து வைத்த நிலானுக்கும் அதை நனவாக்கி உயிர் தந்த அகளங்கனுக்கும் அவன் குடும்பத்தாருக்கும் நன்றி."],"sign":["அர்ச்சுதன் நித்தியானந்தன்,","வெள்ளவத்தை,","கொழும்பு."],"aninthurai":{"paras":["இலக்கிய வகைகளில் முதலிடம் பெறுவது கவிதையே ஆகும். கவிதையின் கருத்து, கற்பனை, உணர்ச்சி, வடிவம் ஆகியவற்றின் ஒருங்கமைவும், ஒழுங்கமைவும் இதற்கான காரணம் எனலாம். கவிதை என்பது உள்ளத்து உணர்ச்சிகளைச் செறிவாகவும் சுருக்கமாகவும் சொல்வது. இன்னொருவிதமாகச் சொல்வதானால் கவிதை என்பது அழகியல் உணர்ச்சியுடைய, ஓசை சந்தத்துடன் கூடிய அல்லது ஒத்திசை பண்புச் சொற்களால் கோர்க்கப்பட்ட இலக்கியக் கலை வடிவம் ஆகும். ஒலியின் அழகியல், ஒலிக் குறியீடுகள், மற்றும் சந்தம் என்பவற்றோடு பாடுபொருளினை வெளிப்படையாகக் காட்டுவதாக அமைவது வழக்காக உள்ளது.","“உள்ளத்துள்ளது கவிதை - இன்பம்\nஉருவெடுப்பது கவிதை\nதெள்ளத்தெளிந்த தமிழில் - உண்மை\nதெரிந்துரைப்பது கவிதை”","என்று கவிமணி தேசியவிநாயகம்பிள்ளை கவிதைக்கு விளக்கம் கூறுகிறார். “ஒவ்வொரு கோணத்திலும் கவிதை என்பது உணர்ச்சிகளின் மொழி” என்கிறார் வின்செஸ்டர். “கவிதை மனிதனின் உணர்ச்சியில் பிறந்த உண்மை. மனித உள்ளம் யதார்த்த உலகத்துடன் ஒன்றுபட்டோ, பிரிந்தோ கண்ட கனவு. அது உள்ள நெகிழ்ச்சியிலே உணர்ச்சி வசப்பட்டு வேகத்துடன் வெளிப்படுவது” என்கிறார் புதுமைப்பித்தன்.","இந்த விளக்கத்தின் அடிப்படையில் கவிதை என்பது உள்ளத்து உணர்ச்சியைச் சிந்தனையுடன் கலந்து மொழிவழியாக வெளிப்படுத்தும் ஓர் ஊடகமாக சமுதாயத்தில் நிகழும் நிகழ்ச்சிகளின் தீவிர உணர்வின் வெளிப்பாடாக அமைகிறது எனலாம். இதன்மூலம் உணர்ச்சிகளை, உணர்வுகளை, மனக்கோலங்களை, கற்பனைகளை, கருத்துக்களை, அழகியலை வெளிப்படுத்தவும் தூண்டவும் கவிதை உதவுகின்றது எனலாம்.","கவிஞனின் கண்ணில் படும் காட்சிகள் அவனின் மனதில் பதிகின்றன. அந்தக் காட்சிகளை அவன் தனது அனுபவங்களுடன் பொருத்திப் பார்க்கின்றபோது காட்சியும் அனுபவமும் இணைந்து கவிதையாக வெளிப்படுகிறது. அதாவது கவிதை என்பது காணும் பொருளை வருணிப்பதில் இல்லை. மாறாக அப்பொருள்களைக் காணும்பொழுது எழும் மனநிலையில்தான் உள்ளது. ஒரு கவிதை என்பது எந்தப் பொருளைப் பற்றியும் பேசலாம். அது இயற்கையைப் பற்றியதாக, வாழ்வியல் பற்றியதாக, சமூகவியல் பண்பாட்டியல் பற்றியதாக, அறிவியல் பற்றியதாக எதுவாகவும் அமையலாம்.","இவ்வாறு உருவாகும் கவிதை என்பது தேர்ந்தெடுக்கப்பட்ட சொற்களால் அழகுறக் கட்டப்படுகிறது. இதன்போது கவிதையில் சரியான வார்த்தைகள் சரியான இடத்தில் அமைய வேண்டும். “கவிஞன் வார்த்தைகளை எடுத்துக் கோர்ப்பதில்லை. உணர்ச்சியின் பெருக்கு, சரியான வார்த்தைகளைச் சரியான இடத்திற்குக் கொண்டு செல்கிறது” என்கிறார் புதுமைப்பித்தன். நல்ல கவிதை என்பது அழகியல் உணர்ச்சியைத் தரக்கூடியது. உயர்ந்த கவிதைகள் யாவும் வாசகர்களை முழுமையாக ஈடுபட வைத்து அவர்களிடம் கவிஞர்களின் அனுபவத்தையே பெற வைத்துவிடுகின்றன. அவர்கள் உணர்ந்த விரும்பும் உண்மைகளையும் உணர்த்தி விடுகின்றன. கவிதைகளில் பெரும்பாலானவை பயிலும்போது இன்பம் தரு அப்பா. அப்படித்தானே நினைப்பினம்\"","“Then நீங்க அவரோட போக போறிங்களா?” என்னுள் ஏற்பட்ட ஏமாற்றத்தை மறைத்துக்கொண்டேன் .","அவள் சிரித்தாள். அதில் ஏளனம் தெரிந்தது.என்னவென்று எனக்கு புரியவில்லை","\"அவரை பிரியும் போதே முடிவெடுத்திட்டேன். அவருடனான வாழ்க்கையின் முற்றுப்புள்ளி அது.இனி அதை காற்புள்ளியாக்கி தொடர எனக்கு விருப்பம் இல்லை .எனக்கு வெண்மதிதான் எல்லாமுமே .ஆனால் எனக்கென்றும் ஒரு வாழ்க்கை, சுய கெளரவம் எல்லாமே இருக்கு . அதை விட்டுக்கொடுக்க நான் தயாரில்லை\"","\" அப்படி என்றால் வெண்மதியோட தனியா வாழப்போறீங்களா ?”","ஒரு நிசப்தம் எங்களை சூழ்ந்தது .அந்த கேள்வியில் அவள் உடைந்துபோனாள் .அந்த கணம் வார்த்தைகள் வர தடுமாறியது .","\"இல்லை...... வெண்மதியை அவள் அப்பா கிட்டவே அனுப்ப போறேன்….”","அவள் அழுகையை அடக்கி விட்டாள். நான் ஏதும் ஆறுதலாக பேச வேண்டும். ஆனால் என் உள்ளத்திலோ ஆயிரம் வினாக்கள். என்னால் கேட்க முடிந்தது ஒன்று மட்டும் தான்.","“ஏன்?”","\"நான் ஒன்றும் அதிகம் படிக்கவில்லை. அதனால் நல்ல வேலையும் எனக்கு கிடைக்கவில்லை.நிச்சயம் என்னால் மட்டும் தனியாக வெண்மதியை வளர்க்க முடியாது.அதுக்காக இன்னொரு திருமணத்திற்கு நான் தயாரில்லை அவர் வேண்டுமென்றால் ஒரு தவறான கணவரா இருக்கலாம் ஆனால் அவர் ஒரு நல்ல அப்பா .அவரால் தான் வெண்மதிக்கு ஒரு நல்ல future கொடுக்க முடியும் .This is for her best”","ஒரு பெண்குழந்தையை இந்த காலத்தில் ஓர் ஆணிடம் தனியாக கையளிக்கலாமா? .ஒரு ஆணால் தனியாக பெண்குழந்தையை வளர்க்க முடியுமா ? வெண்மதியை பிரிந்து சாராதாவால் இருக்க முடியுமா?நாளைக்கே வெண்மதி சாரதாவை மறந்துவிட்டால் ?இதை எல்லாம் இந்த சமூகம் ஏற்றுக்கொள்ளுமா? .இவை எல்லாம் கேட்க வேண்டும் போல் இருந்தது . ஆனால் கேட்கவில்லை .சாரதா இவையெல்லாம் யோசித்திருப்பாள் இவற்றிற்கும் அவளிடம் ஏதோ பதில் இருக்கும்.அவள் எடுத்த முடிவு இறுதியானது என்று அவளின் கண்களின் உறுதி எனக்கு சொன்னது.","எங்கிருந்தோ ஓடி வந்த வெண்மதி சாரதாவின் காதில் ஏதோ செல்லமாக சொல்ல சாரதாவும் என்னிடம் விடைபெற்றாள்.","§","அதற்கு பின் பல நாட்கள் பல சம்பவங்கள் அரங்கேறின .பலர் சாரதா வீட்டுக்கு வருவதும் பலமுறை சாரதா உரத்து அவர்களை திட்டுவதுமாக நாட்கள் கழிந்தன. ஆனால் எனக்கு ஒன்று மட்டும் தெளிவாக தெரிந்தது.வெண்மதியுடனான என் நாட்கள் மட்டுப்படுத்தப்பட்டன. அது நிச்சயம்.","வெண்மதிக்கு நடப்பது ஏதும் தெரியாது .அடிக்கடி என் வீட்டில் வந்து விளையாடும் போது “ அம்மா ஏன் அழுறா?” என்று கேட்பாள் .அவளுக்கு ஏற்றவாறு ஏதும் பொய் சொல்லி சமாளித்து விடுவேன்.","இறுதியில் வெண்மதி அவள் அப்பாவிடம் செல்லும் நாள் வந்தது .அவளை அழைத்து செல்ல வெண்மதியின் தந்தைவழி தாத்தா பாட்டி வந்திருந்தனர் . சாரதா தைரியமாக தான் இருந்தாள் .அழவில்லை. வெண்மதியை பொறுத்தமட்டில் அது உல்லாச சுற்றுலா.அவளுக்கு தன் தாயை நிரந்தரமாக பிரிகிறோம் என்று தெரியாது .நான் மறக்காமல் வாங்கி வைத்திருந்த lactose free சாக்லேடை எடுத்து நீட்டினேன் .வெண்மதி கிளம்பும் போது நான் இருக்கவில்லை .ஸ்கூலுக்கு போய்விட்டேன்","நான் திரும்பி வரும் போது சாரதா வீட்டின் வெளியில் ஒரு ஜோடி செருப்பு மட்டுமே மீதமிருந்தது.அந்த வீடு அதற்கு பின் பல நாள் பூட்டியே இருந்தது.","§","வெண்மதி வெளிநாடு போய் 3 மாதம் ஆகிறது. சாரதாவிற்கு எங்கோ ஒரு நாட்டில் ஏதோ வேலை கிடைத்திருக்கிறது .இன்று அவள் வீடு காலி பண்ணுகிறாள்.","இந்த காலத்தில் சாரதா எவ்வளவோ தேறி விட்டாள் . ஆனால் இந்த சமூகம் மீளவில்லை. முதுகுக்குபின்னால் அவளை “இவள் எல்லாம் ஒரு அம்மாவா !” என்று கேட்கும் கூட்டமும் அவளுக்கு தூண்டில் போடும் சில ‘தூய’ உள்ளங்களும் இருக்கத்தான் செய்தன .சாரதா அவர்களை சட்டை செய்யவில்லை","என்னளவில் சாரதாவின் கண்களில் நேர்மை இருந்தது . தெளிவு இருந்தது .அது போதும் எனக்கு.சாரதா புரட்சி பெண்ணோ அல்லது புராண காலத்து தலைவியோ அல்லள் .தனியாக வாழும் பெண்ணுக்கு வேலை கொடுத்து உயர்த்தி விட இது ஒன்றும் சினிமா அல்ல. இதுதான் யதார்த்தம் .கலாசாரமும் மதமும் இந்த சமூகத்திற்கு பூட்டு போட்டு விட்டது . ஆனால் எல்லோராலும் அந்த எல்லைக்குள்ளே வாழ முடிவதில்லை .அதை அவர்கள் விரும்பியோ விரும்பாமலோ தேர்ந்தெடுக்கிறார்கள் .அதை புரிந்து கொள்ள இந்த உலகம் இன்னும் பக்குவப்படவில்லை .அதுதான் நிஜம்","சாரதா கிளம்பும் நேரம் வந்தது .கிளம்பும் முன் சொல்வதற்காக என் வீட்டு கதவை தட்டினாள். நான் திறந்த போது “Thank you………for everything” என்றாள்.நானும் “Have a safe journey!” என்று கூறிவிட்டு உள்ளே நுழைகையில் ,","\"Excuse me, sorry உங்க பெயரை நீங்க எப்பவுமே சொன்னதில்லை, If you don’t mind உங்க பெயர் என்ன?”","என் கையிலிருந்த லொலிபொப் குச்சியை அவளிடம் நீட்டி விட்டு சொன்னேன் ,","\"இரயில் சிநேகிதன் \""],"w":1892,"ic":"pen"},{"t":"காதல்","b":["மேரி மாதாவின் முன்னாள் பிராத்தித்தபடியே நின்றாள் உமா .எவ்வளவு நேரம் அப்படியே இருந்தாள் என்று அவளுக்கு தெரியாது .பக்கத்துக்கு படுக்கை ராசம்மா தட்டிய போதுதான் அவளுக்கு நினைப்பு வந்தது .","\"அவங்கள எல்லாம் கும்பிடாதடி.பொறகு பொட்டபுள்ளத்தான் பொறக்கும்!.அங்க எதிர்க்க்க இருக்குற கண்ணனை கும்பிடு .கொலு கொலு எண்டு அவரே உனக்கு புள்ளய பொறப்பார் ..\" என்றாள் ராசம்மா.","சிரித்தபடியே வந்து படுக்கையில் அமர்ந்தாள் உமா .இந்த கண்ணனை கும்பிட்டு கருப்பா பிள்ளை பிறந்தால் குடிச்ச குங்குமப்பால் எல்லாம் வீணாய் போயிடும் என்று உள்ளுக்குள் எண்ணி சிரித்துக்கொண்டாள்.","நேரம் 4 மணி.கடிகாரத்தை பார்த்தவாறே கண்களை அங்கும் இங்கும் உருட்டினாள் .விசிட்டிங் டைம் தொடங்கியும் இன்னும் வராத கணவனுக்கான ஏக்கம் அவள் கண்களில் தெரிந்தது.","\"சரி. வரட்டும். இன்னும் கொஞ்ச நாள் தானே ... இன்னைக்கோ நாளைக்கோ .அவன் பிள்ளையே வெளில வந்து டைமுக்கு வரத்தெரியாதா அப்பா எண்டு கேப்பான் பார் ..\" என்று சற்று வாய் விட்டு உரக்க கூறிவிட்டாள் உமா.","அப்போதுதான் அயர தொடங்கிய ராசம்மா சத்தம் கேட்டு உமாவை முறைத்து பார்த்தாள் .அதை கண்டு பயந்த உமா எதிரே இருந்த யன்னல் நோக்கி முகத்தை திருப்பி கொண்டாள் .","வெளியே 'சோ ' என மழை .மழையுடன் வீசிய சுழல் காற்றில் யன்னல்கள் பட படவென அடித்து கொண்டன .யன்னலை சாத்த உமாவுக்கு மனமில்லை .அந்த காற்றை போல் ஒரு காலத்தில் அடங்கா குதிரையாக திரிந்தவள் தானே உமா .அவளையும் அடக்க ஒருத்தன் வந்தானே!","உமாவின் உள்ளம் நினைவலைகளில் நீந்தியது .சிவா!.அவன்தான். ”அச்சச்சோ அவரை நீ அத்தான் என்றல்லவா அழைக்க வேண்டும் தோழி\" என்று கீதா கேலி செய்தது நினைவுக்கு வந்தது .","“சிவா! சிவா! சிவா! .அவன் பெயரை சொல்லும் போது என்ன எல்லாமோ செய்கிறதே. இதை சொன்னால் அதற்கும் ஒரு கவிதை சொல்லுவான்.அப்படி கவிதை சொல்லியே என்னை கவிழ்த்தவன் தானே அவன் .நீ ஒரு அடங்கா குதிரை என்று சொல்லி முதல் முதல் எனக்கு ஒரு பாரதியார் கவிதை சொன்னானே .என்ன அது ? .. ஆ.","'தென்னையில் கீற்று சல சல என்றிட","செய்து வரும் காற்றே","உன்னை குதிரை கொண்டேறி திரியுமோர்","உள்ளம் படைத்தது விட்டோம் '","நான் குதிரையாம் .அவனை நான்தான் இழுத்து செல்ல வேண்டுமாம். அப்பப்பா…...இந்த ஆண் பிள்ளைகள் தான் எத்தனை கள்வர்கள் .நான் எங்கே அவனை இழுத்தேன் .அவன் தான் என்னை நேரம் கேட்ட நேரமெல்லாம் இழுத்து....\"","காதலும் காமமும் கன்னியர் உள்ளம் கொண்டால் காலம் போயினும் கலையாது என்பது எத்துனை உண்மை !","“காதல் கணவனும் களிப்பான குடும்பமும் இருந்தும் கரும்புள்ளியாக இருந்தது நாம் வாழ்ந்த வாழ்விற்கான சாட்சி.10 வருஷமாகியும் குழந்தை இல்லாமல் நான் பட்ட துன்பம் சொல்லி முடியாது .என்னை விட சிவா பட்ட கவலை இருக்கே . பாவம் அவன் .அவனுக்கு தான் குழந்தை என்றால் அலாதி பிரியம் என்னை மலடி என்று கூப்பிட்டது கூட பரவாயில்லை .ஆனா சிவாவை பற்றி தப்பாய் பேசினப்ப தான் என் மனசு உடைஞ்சு போச்சுது .எனக்கு தெரியாம அவன் கண்கலங்கி நிண்டானே.ஆனால் அவன் கவலையில் ஒரு பங்கு கூட என்னிடம் காட்ட மாட்டான் .அத்தனை காதல்.”","“குழந்தை இல்லாதவர்கள் காலம் காலமாக சொல்வதுதான் ,பார்க்காத வைத்தியம் இல்லை .போகாத கோயில் இல்லை .இப்பதான் எல்லாம் கூடி வந்திருக்கு ,அதான் தெய்வ சித்தம்”","“சரி, அவன் கஷ்டம் எல்லாம் போக்க தான் ஒரு வீரன் வர போறானே !”","அவள் தோளில் கை பட நினைவுலகில் இருந்து நனவுலகுக்கு வந்தாள் உமா .எதிரே சிவா சிரித்தபடி நின்றான்.","\"இதுதான் உன் பன்ச்யுயாலிட்டியா?\" என்று முறைத்தபடி கேட்டாள் உமா.","“சாரி டி .ஆபீஸ்ல கொஞ்ச வேல ..”","“நல்லா இருக்கே .இன்னைக்கோ நாளைக்கோ வலி வந்துடும் எண்டு டாக்டர் சொல்லி இருக்கார் .நீ ஆபீஸ்லேயே இரு .பிள்ளை பொறந்ததும் நானே சைன் வச்சு வீட்டை வந்துடுறேன் .நேர வீட்டை வந்து பாரு”","சிவா சிரித்தான். “நீ ஒரு வார்த்தை சொல்லு. நான் ரிசைன் பண்ணிட்டு உன்கூடவே வந்துடுறேன்”","\"அசடு. நான் சொன்ன உடனே பைத்தியம் மாறி பண்ணுவியா?.யாரு பிறகு நம்ம பையனுக்கு டிரஸ் வாங்குறது? பவுடர் வாங்குறது ?”","“பையன் எண்டே முடிவு பண்ணிட்டியா ?”","“ஆமாடா. நிச்சயம் பையன் தான் .எனக்கு தெரியும் .நீ வந்து பக்கத்துல உட்காறேன் !”","சிவா வந்து பக்கத்தில் இருந்தான்.","“நம்ம பையனுக்கு என்ன பெயர் வைக்கலாம்?”","“இப்பவே எதுக்கு அவசரப்படுற!”","“இல்ல.இப்பவே யோசிக்கணும்.எப்பயோ யோசிச்சிருக்கணும்.இதுவே லேட்!!!”","“சரி. நான் சிவா .நீ உமா .நம்ம பையனுக்கு முருகன் எண்டு வைப்பம்”","“உன்ன போய் கேட்டேனே. சரியான பழைய பஞ்சாங்கம் நீ .நீ வேணாம் நானே நல்ல பெயரா யோசிச்சு வைக்கிறன்”","சிவா மீண்டும் சிரித்தான் .அவன் முகத்தில் எதன் காரணமாகவும் அந்த சிரிப்பு மட்டும் போகாது போலும்.","“சரி பெயர் வைக்குற பங்க்ஷனுக்கு யாரை எல்லாம் கூப்பிடனும் ? நீயே அதையும் சொல்லிடு உமா”","“யாரை கூப்பிட்டாலும் பக்கத்துக்கு வீட்டு ராதாவை கூப்பிடவே கூடாது!”","“ஏண்டி .அவங்கதான் உனக்கு குழந்தை பிறக்கணும் எண்டு கோயில் பிரசாதம் எல்லாம் தந்தாங்க?”","\"அது எல்லாம் இருக்கட்டும். நமக்கு குழந்தை பொறக்காததுக்கு உன் மேல தான் பிழை இருக்கு எண்டு ஊர் பூரா சொல்லி வச்சது அவள் தான். அவள் மேல எவ்வளவு கோவம் தெரியுமா எனக்கு???”","“என் மேல அவ்வளவு பாசமா உனக்கு?” என்றான் கலங்கியபடியே சிவா.","“இல்லாம!” என்று பதிலுக்கு வெகுளியாக சிரித்தாள் உமா.","பக்கத்தில் ராசம்மா தூங்கி விட்டதில் நன்கு குறட்டை விட்டபடி இருந்தாள்.\"பாரேன் இவளை மாதிரியே தான் நாளைக்கு இவ பிள்ளையும் குறட்டை விடும்\" என்று சொல்லி விட்டு கலகலவென சிரித்தாள் உமா.","அவள் சிரிப்பில் உதிர்ந்த முத்துக்களை எல்லாம் எடுத்து மாலையாய் கோர்க்க வேண்டும் போல தோன்றிற்று சிவாக்கு.","“மஹாராஜா எந்த ஜமீனை வாங்குறதா உத்தேசம்?”","“உன்ன தான்”. \"உன்ன பார்க்கும் போது ஒன்னு சொல்லணும் போல இருக்கு…..”","“என்ன? சொல்லேன் !….”என்றாள் குழந்தை போல.","“நீ இதழ் பதித்த பண்டம் எதையும் என் விரல்கள் தீண்ட கூடாது என்று கட்டளையிடுகின்றன என் உதடுகள் “","“ஏனாம்? உன் உதடுகளுக்கு அவை வேணுமாக்கும்?”","“இல்லை.அவைக்கு எச்சிற் பண்டம் வேண்டாமாம் அவற்றை எச்சிற்படுத்தியவள் தான் வேணுமாம் “என்றான் விஷமமாக.","வெட்கத்தில் சிவந்த கன்னங்கள் ஆகாய சூரியனையும் மழுங்கடித்துவிடும். அத்தனை வெட்கம் அவளுக்கு .","“பாரேன் உன் அப்பாவுக்கு இன்னொரு பாப்பா வேணுமாம் .அவசரம் அவசரம்..”","சிரித்து மகிழ்ந்ததில் நேரம் முடிந்து சிவா புறப்பட்டான்.","கீழே நின்று பார்க்கையில் யன்னல் ஓரம் நின்று அவனுக்கு கை காட்டினாள் உமா.அவள் முகத்தில்தான் எத்தனை காதல். காதலே நோய் .காதலே மருந்து.அனைத்திலும் காதல் தான் .சிவா சிரித்தான் .சிவா அழுதான். கூடவே அந்த மன நல காப்பகம் என்ற பலகையும் அவனை பார்த்து சிரிப்பதாய் அவனுக்கு தோன்றியது."],"w":717,"ic":"flower"},{"t":"வெறுமைக்கவிதைகள்","b":["v:என் உணர்வுகளுக்கு\nஉருவம் கொடுத்து\nஉடல் கொடுத்து\nஉங்கள் மத்தியில் உலவ விடுகிறேன்\nஅதில்\nநிறை\nகுறை\nகுற்றம் .............. எதுவும் இருக்கலாம்\nஎல்லாவற்றையும் ஏற்கிறேன்\nகருவின் முதலாக","n:1","மலைக்கோயில் வாசலில் இராஜி அமர்ந்திருந்தாள் .சுற்றிலும் இருந்த இயற்கையின் எழில் அவளை மயக்கியது..தரிசனத்திற்கு வந்ததையே மறந்து விட்டு இராஜி அமர்ந்திருந்தாள். திடீர் என்று நினைவு வந்தவளாட்டம் திரும்பி பார்த்தாள் .அமிர்தாவை காணவில்லை.எழுந்து சென்று சுற்றிலும் தேடினாள் .அவளோ அந்த அரச மரத்தடியில் ஓடி விளையாடி கொண்டிருந்தாள் .","\"அமிர்தா .இங்க வா !மேல குரங்கெல்லாம் இருக்குறது தெரியலையா?என் பக்கத்துல தானே இருக்க சொன்னன் .எதுக்குமா இங்க வந்த! \"அவள் குரலில் தேடலின் கோபம் கொஞ்சம் இருக்கத்தான் செய்தது.","அவளின் கோபத்திற்கு அணை போட்டு அமிர்தாவுக்குவிற்கு அரணாய் பாலா அங்கு வந்து நின்றான்.\"கொஞ்ச தூரம் அங்காள போய்ட்டன்.அதுக்குள்ளே இவள் கலாட்டா பண்ணிட்டாளா! \" என்றான் பாலா.","இந்த உரையாடலின் இடையில் தாயின் அதட்டலுக்கு பயந்து போன அமிர்தா அப்பாவின் கைகளை எட்டி பிடிக்க முயன்றாள்;முடியவில்லை. அவன் கால்களை இறுக்க கட்டி கொண்டாள்,","\"எதுக்கு என்ன தனியா விட்டுட்டு போனீங்க. புது ஊர் வேற.பயந்துட்டன் தெரியுமா?எத்தனை தடவ சொல்லி இருக்கன்.போறதுண்டா சொல்லிட்டு போகணும் எண்டு \"","\"எப்பயும் உன் கூடவே இருக்க முடியுமா இராஜி. ஒரு நாள் நீயும் தனியா இருக்க பழக வேண்டி வரும்\" சிரித்துக்கொண்டே பாலா சொன்னான் .","இராஜிக்கு உள்ளுக்குள் கோபம் பீறிட்டு கொண்டு வந்தது .\"கோயில்ல வச்சு வேற ஒன்னும் பேச தெரியாதா.நம்ம சண்டையை அப்புறம் வச்சு கொள்ளுவம் முதல்ல அர்ச்சனையை முடிச்சிட்டு கிளம்பனும்.இப்ப கிளம்பினா தான் மதியம் சோறு வடிக்க சரியா இருக்கும் \"என்று அவசரமாய் இராஜி முன்னுக்கு கிளம்ப பாலா அமிர்தாவை தூக்கி கொண்டு பின் தொடர்ந்தான்.","n:2","வீடு ஏதோ களேபகரமாக இருந்தது","\"சிந்து! அந்த பைலை பார்த்தியா ?\" என்று அறைக்குள் இருந்தவாறே கத்தினான் ஆதி.","\"கொஞ்சம் பொறு. நல்லா தேடி பாரு .நான் இங்க அடுப்பை கவனிக்கிறதா .இல்லாட்டி உன்னைய கவனிக்குறதா ?\"","இவற்றையெல்லாம் ஹால் இல் அமர்ந்திருந்து வேடிக்கை பார்த்துக்கொண்டிருந்தாள் மங்களம். அவளின் மூக்கு கண்ணாடி கூட சரியாக நிற்காமல் வழுக்கி கீழே வந்துகொண்டிருந்தது .அத்தனை முதுமை .","\"பைல் கிடைச்சிட்டு ! நான் போட்டு வாறன் சிந்து ! \" என்று கூறி விட்டு அவள் பதிலை எதிர்பார்க்காமலேயே புறப்பட போனான் ஆதி.","போனவன் ஏதோ நினைவு வந்தவனாய் \"அம்மா !போட்டு வாறன்!\" என்றான்.","மங்களம் \"பத்திரமா போட்டு வாப்பா \" என்றாள் .அவளின் சிரிப்பு மறையும் வரை கூட அவன் நிற்கவில்லை.அவளும் அந்த சிரிப்பை ஏமாற்றத்துடன் முடித்து கொண்டாள் .அவனும் புறப்பட்டு போய் விட்டான் .","சிந்துவும் பையை எடுத்து கொண்டு வெளியே வந்தாள் .","\"மாமி! சாப்பாடு செஞ்சு வச்சிட்டன் ..லஞ்ச் உம் சேர்த்தே பண்ணிட்டன்.ஹீட் பாக்ஸ் ல இருக்கு .நீங்க எடுத்து சாப்புடுங்கோ .சூடு ஆறிப்போச்சுண்டா ........ கொஞ்சம் இருங்கோ மாமி\" என்று கூறி விட்டு ஒரு துண்டில் ஏதோ எழுதினாள்.","\"மாமி இந்த துண்டை இங்க வைக்கிறன். நீங்க வீட்டை கிளீன் பன்ன வழமையா வருவாளே . அவகிட்ட காட்டுங்க .அவள் சுடப்பண்ணி தருவாள் .எல்லாம் சரி தானே மாமி?!\" என்று சொல்லி விட்டு புறப்பட தயாரானாள்.","“சிந்து …………………… ஒரு நிமிஷம்!”","“என்ன மாமி ………………,என்ன வேணும் ?”","“சிந்து …………………….நேத்தே உன்ன கேக்கணும் எண்டு நினைச்சன்……………….நீங்க ரெண்டு பேரும் தூங்கிட்டிங்க .....................என்னை இன்னிக்கு கோயில்ல போய் விட்டுட்டு வேலைக்கு போறியாமா? …………………...திரும்பி நானே தனியா வந்துடுவேன் \"","அப்போதுதான் மங்களம் புடைவை எல்லாம் கட்டி தயாராய் இருப்பதை சிந்து பார்த்தாள்.","\"என்ன மாமி? இந்த ஊருக்கு வந்து நீங்க எங்கயும் வெளில போனது கூட இல்ல! .நம்மாக்களும் பெருசா இந்த ஊருல இல்ல.பாஷை வேற தெரியாது !.எப்படி மாமி தனியா அனுப்ப ……………………….இன்னிக்கு என்ன விசேஷம் ?....................ஏதும் சஷ்டி சதுர்த்தி அப்படி ஏதுமா ?”","“இல்லம்மா சிந்து ...இன்னிக்கு அவரோட பிறந்த நாள் ...\"","சிந்துவுக்கு என்ன சொல்வதென்றே தெரியவில்லை. ஆதியின் அப்பா சமீபத்தில் தான் தவறினார்.அதற்கு பிறகு தான் ஒரு மாறுதலுக்காக ஊர் மாற்றலாகி குடும்பமாக இங்கே வந்தான் .மங்களம் இங்கு வந்த பின்னர் எங்கும் வெளியில் போக விரும்பவில்லை .இன்றுதான் முதல் முறையாய் சிந்துவிடம் வெளியில் போக கேட்ட போது சிந்துவால் மறுக்க முடியவில்லை.","\"கொஞ்சம் இருங்கோ மாமி.ஆபீசுக்கு லீவு சொல்லிட்டு வாறன்\" என்று உள்ளே சென்றாள். மங்களத்தின் முகத்தில் அதுவரை இல்லாத ஒரு செந்தளிப்பு .ஆனால் அதை கவனிப்பதற்கு சிந்து அங்கு நிற்கவில்லை.","n:3","அர்ச்சனையை முடித்துவிட்டு இராஜி மெதுவாக கீழே இறங்கினாள்.அவளுக்கு முன்னாள் அமிர்தாவை தூக்கி கொண்டு பாலா பட பட என்று கீழ இறங்கினான்.","“வளர்ந்த புள்ளைய தூக்கி கொண்டு போறிங்களே .அசிங்கம்.அசிங்கம் .கீழே இறக்கி விடுங்கோ !”என்று இராஜி கத்தினாள் .பாலாவோ அது ஒன்றும் காதுகளில் விழாதது போல் போய் கொண்ட “","இராஜி சிரித்தாள்","“அந்த சிரிப்பு .அது மட்டும் மாறவேயில்லை .சிரிக்க எவ்வளவு அழகா இருக்குற தெரியுமா?”","இராஜி திருப்பியும் சிரித்தாள்.","“இதுதான் என் நம்பர் . நோட் பண்ணிக்கோ.ஒரு மிஸ்ட் கால் குடு.அட்ரஸ அனுப்புறேன் .மேல மாமிய தனியா விட்டுட்டு வந்துட்டன்.பிறகு கதைக்குறன்” என்று நம்பர் பரிமாற்றத்துடன் மேலே பறந்தாள் சிந்து .","இராஜி கீழே இறங்கி வரும் போது பாலா அவளுக்காய் காத்து நின்றான்.","\"என் ஸ்கூல் பிரென்ட் .சிந்து .இந்த ஊர் தானாம் .அதுதான் கதைச்சிட்டு வந்தன் “","\"அப்ப உனக்கு பேசுறதுக்கு ஒரு பிரென்ட் கிடைச்சுட்டா .இனி எங்க ரெண்டு பேரையும் மறந்திடுவ! \"","\"சும்மா கிண்டலடிக்கலாமா போங்கோ முதல் .நேரமாச்சு !!”என்று சொல்லிக்கொண்டே நடந்தாள் இராஜி.","n:4","\"மாமி! வெளில போய்டு வந்திருக்கீங்க ....போய் படுத்து ரெஸ்ட் எடுங்க .மலைல இருந்து இறங்கும் போதே கொஞ்சம் இருமினிங்க .டாக்டர கூப்பிடவா ?\"","\"நிறைய நாளைக்கு பிறகு மலை ஏறினன் இல்ல .அதான் ......சிந்து ......கோயில்ல நம்ம பழையவீட்டுக்கு பக்கத்துல இருந்தாளே அமிர்தம்....\" என்று மங்களம் தொடங்க,","\"மாமி .ஆபீஸ்க்கு halfday தான் சொல்லிட்டு வந்தன் ......டைம் ஆகுது ...........கிளம்பனும்..................ரேடியோல பாட்டு போட்டு விடுறன்............... கேட்டுட்டே தூங்குங்கோ \" என்று சிந்து இடைமறித்தாள்.","மங்களம் அவள் ஏமாற்றத்தை முகத்தில் மறைக்கவில்லை .ஆனால் சிந்து அதை புரிந்துகொள்ளவும் இல்லை.","சிந்து போய் ரேடியோவை போடவும் அது பாட தொடங்கியது .","\"பறந்து செல்ல நினைத்து விட்டேன் எனக்கும் சிறகில்லையே","பழக வந்தேன் தழுவ வந்தேன் பறவை துணையில்லையே","எடுத்துச் சொல்ல மனமிருந்தும் வார்த்தை வரவில்லையே","என்னென்னவோ நினைவிருந்தும் நாணம் விடவில்லையே! ...........................சிட்டுக்குருவி முத்தம் ....\"","\"ரொம்ப பழைய பாட்டா இருக்கே .ஏதும் ராஜா பாட்டு ஸ்பீக்கர்ல போட்டு விடவா மாமி?\"","\"இல்லம்மா இது போதும் \"என்று சொல்லிவிட்டு கண்ணயர்ந்தாள் மங்களம்.","n:5","\"இராஜி எப்படி வீட்டை கண்டு பிடிச்ச!!\" என்று வாசலில் நின்று கொண்டிருந்த இராஜியை பார்த்து கேட்டாள் சிந்து .","\"ஏண்டி....... என்ன அவ்வளவு பழைய பஞ்சாங்கம் எண்டு நினைச்சியா .அதான் போன் இருக்கில்ல .அதோட ரொம்ப தூரம் இல்ல ………….ஒரு கிலோமீட்டர் தள்ளி தான் என் வீடு இருக்கு .மேப் சொல்லிச்சு.அதான் ச  இந்த ஊருக்கு வந்தம் \"","“உங்க மாமிக்கு தனியா இருக்க போர் அடிக்காதா”","“சீ .அவங்க பெருசா யாரோடையும் எப்பயுமே பேச மாட்டாங்க .அவங்க பாட்டுக்கு புத்தகமும் கையுமா இருப்பாங்க .அவங்களுக்கு அதுதான் பிடிக்கும்”","இராஜி ஒன்றும் பேசவில்லை","“சரி நான் கிளம்புறேன் சிந்து ..இன்னொரு நாளைக்கு முடிஞ்சா என் வீட்ட வா!”","“சரிடி…………….. கதவை சாத்திட்டு போ .எனக்கு உள்ள கொஞ்சம் வேல இருக்கு!” என்று சொல்லி விட்டு சிந்து உள்ளே போனாள்","இராஜி போகும் முன் மங்களம் இருந்த அறையை எட்டி பார்த்தாள்","மங்களம் தூங்கவில்லை .நடுவில் போட்டிருந்த மெத்தை கட்டிலில் அமர்ந்தபடியே ஜன்னலை பார்த்துக்கொண்டு இருந்தாள்","மங்களம் அங்கு வசதியாக தான் இருந்தாள் .பார்க்கவே இராஜிக்கு புரிந்தது .ஆனா அங்கு எதோ ஒரு வெறுமையும் இருந்தது .அது மங்களத்தின் உள்ளத்திலும் இருந்தது.","இராஜி எதோ மனதுக்குள் நினைத்தவளாட்டம் மீண்டும் சிந்துவை பார்க்க உள்ளே போனாள்","அங்கு சிந்துவோ அவசர அவசரமாக கம்ப்யூட்டர் முன்னாள் டைப் பண்ணி கொண்டிருந்தாள்","இராஜி பேசாமல் கதவை சாத்திவிட்டு வெளியே போனாள்","n:6","காலிங் பெல் ஐ அழுத்தி விட்டு சிந்து வெளியில் நின்றாள் .","இராஜி வந்து கதவை திறந்தாள் .”வா சிந்து .உள்ள வா !”","சிந்து வந்து சோபாவில் அமர்ந்தாள் .அவள் முகத்தில் பெரிதாக மகிழ்ச்சி இல்லை","“என்ன சிந்து ஆச்சு ?.திடீர் எண்டு போன் பண்ணி வீட்ட வாறன் எண்டு சொன்ன .ஏன் கவலையா இருக்க ?”","“மாமிக்கு ரெண்டு நாலா உடம்பு சரி இல்ல .நானும் ஆதியும் வீட்ட தான் நிக்குறம் .என்னாச்சு எண்டே தெரில.நல்லாத்தான் இருந்தாங்க .இப்ப படுத்தே இருக்குறாங்க .எனக்கு அவங்கள பாக்கவே முடில .நான் வெளில கூட்டிட்டு போய் தானே இப்படி ஆச்சு ....”என்று சொல்லும் போதே குலுங்கி அழ தொடங்கினாள் சிந்து.","இராஜி உடனே சென்று அவளை தேற்றி விட்டு தண்ணீர் கொடுத்தாள்","\"....ஆதி தான் இங்கயே இருந்தா உன்னையே blame பண்ணி கவலை படுவ .கொஞ்சம் வெளில போட்டு வா எண்டு அனுப்பினான் .எனக்கும் யார் கூடயும் பேசினா நல்லா இருக்கும் எண்டு தோணிச்சு .அதான் வந்தன்”","இராஜி ஒன்றும் பேசவில்லை .மௌனமாக இருந்தால்.எதுவோ சொல்ல நினைத்துவிட்டு .பிறகு வேண்டாம் என்று விட்டுவிட்டாள்","“ஏன் இராஜி .உனக்கு தொல்லை குடுத்துட்டானா?”","“சீ .அப்படி ஒன்னும் இல்ல .ஒரு வகைல இங்க வந்தது நல்லதா போச்சு .பாலாவும் அமிர்தாவும் வந்துட்டு இருக்காங்களாம் க .வீடு பார்த்து தந்தாங்க.ஆறுதல் சொன்னாங்க யாருக்கும் இப்படி கஷ்டம் வரக்கூடாது எண்டு ஆறுதல் சொன்னாங்க .என்னை எல்லாரும் விழுந்து விழுந்து கவனிச்சாங்க.ஆனா அவங்க யாரும் எனக்கு என்ன அப்ப தேவைப்பட்டது புரிஞ்சுக்கல”","“பாலாவும் அமிர்தாவும் போன சோகம் எனக்கு இருந்தது உண்மைதான்.அத அழுது தீர்த்திடலாம் .இன்ன வரைக்கும் அத தான் பண்ணுறன் .ஆனா அதையும் தாண்டி எனக்கு ஒரு வலி இருந்துச்சு","“என்ன ?” என்பது போல் சிந்து அவளையே பார்த்தாள்.","“வெறுமை .அது எப்படி இருக்கும் எண்டு வார்த்தைல சொல்ல முடியாது .எனக்குள்ள இருந்த ஒண்ண நானே தொலைச்சிட்டன் . அதுக்காக எனக்கு தேவைப்பட்டது எல்லாம் என்னோட வாய்விட்டு பேச ஒரு உயிர் . என்னையும் ஒவ்வொரு நாளும் யாரோ நினைக்குறாங்களே என்ட நினைப்பு! ஆனா யாருக்கும் அது புரியல !!நான் யாரையும் தப்பு சொல்லவும் முடியாது .காரணம் இந்த அவசரமான உலகம் . நானும் ஒருகாலத்துல அதே அவசரத்தோட தான் போனன் .ஆனா நான் நிண்டப்ப என்கூட யாரும் நிக்கல.என்ன தாண்டி எல்லாரும் போயிட்டு இருந்தாங்க. இப்ப கூட நான் அங்கேயே தான் நிக்குறான் சிண்டு ...உன் மாமி மாதிரி ..”","இராஜியின் கண்கள் கலங்கி நின்றன .","இராஜி நடத்தியது தன் வாழ்க்கை பாடம் மட்டுமல்ல .மங்களத்தின் வேட்கைக்கான தீர்வுபடலம் .சிந்துவுக்கும் அது புரிந்தது.அவள் மௌனமாக ஒருநிமிடம் இராஜியையே பார்த்துக்கொண்டிருந்தாள். பின் பையை எடுத்து கொண்டு அவசர அவசரமாக வெளியே போனாள்.","\"ஏன் இராஜி, அவளுக்கு புரிஞ்சிருக்குமா \" என்றான் பாலா","\"புரிஞ்சிடுச்சு ,அதான் போறாளே ,ஆனா \"","\"என்ன ஆனா \"","இராஜி வெளியில் எட்டி பார்த்தாள் .சிந்து வேகமாக நடந்து கொண்டிருந்தாள் .சிந்துக்கு பின்னாடியே மங்களமும் நடந்து போய்க்கொண்டு இருந்தாள்."],"w":1971,"ic":"moon"},{"t":"மருவக்காதல் கொண்டேன்","b":["\"சனநாயகத்தை பாதுகாப்பதற்காக எங்களுக்கு அங்கீகாரம் தாருங்கள்\" என்று ஒரு தளதளத்த குரல் டிவியிலிருந்து வந்தது","விரக்தியின் உச்சத்தில் இருந்த இராகுல் அறையில் இருந்தவாறே கத்தினான்.\" இப்ப அந்த டிவிய நீங்கள் நிப்பாட்டுறியளோ?..... இல்லாட்டி நான் புத்தகத்தை மூடி வைக்கவோ ?\"","\"கொஞ்சம் நேரம் பொறேன்.எலேக்ஷன் வர போகுது போல .எல்லாரும் பேச தொடங்கிட்டினம்.எலேக்ஷன் வந்தா கர்பியூ போடமாட்டினம் .காம்பசும் திறந்துடுவினம் \" என்று பதிலுக்கு சொன்னாள் கல்யாணி","\"போற போக்க பாத்தா இந்த வருஷமே க ……………………………………………….","சொல்லித் தெரிவ தில்லை, மன்மதக்கலை - முகச்","சோதி மறைத்துமொரு காதலிங் குண்டோ ?”","'அவளிற்காகவே பாரதி எழுதி இருப்பாரோ ?. ஆனால் முகத்திரையை விட முகக்கவசம் அவளிற்கு அழகாக இருக்கும் .அவளின் அழகின் ஆதாரமே அந்த கண்கள் தானே !..சீ .இன்னும் உறவே ஆகாதவளை பற்றி இப்படி எல்லாம் நினைப்பது சரியா ?இல்லை இல்லை .உறவாக வரப்போகிறவள் தானே !!.இத்தனை காலமும் அவளுக்கும் என் மேல் அபிப்பிராயம் இல்லாமலா இருந்திருக்கும்? இல்லாவிட்டால் என் மனதில் ஏதோ உள்ளது என்பதை புரிந்து கொள்ளாமலே இருந்திருப்பாள்?நிச்சயம் இல்லை!! நான் சொல்லும் வரை அவள் காத்திருக்கிறாள் .அப்படியாகத்தான் இருக்கும்.'","அவனின் மனத்திரையுடன் அவனே பேசிக்கொண்டான்","சுஜிதா இப்போது என்ன செய்துகொண்டிருப்பாள் என்று யோசித்தான் இராகுல்..இதில் என்ன சந்தேகம் நிச்சயம் படித்துக்கொண்டிருப்பாள் .'அவள் அப்பா கடை வைத்து நடத்தி கொண்டிருப்பதாக கூறினாள் .இந்த கொரோனாவினால் அவர் வியாபாரம் தடைப்பட்டிருக்காதா ?'.....பாவம் மாமா!' என்று எண்ணிக்கொண்ட போது அவனை அறியாமலே அவன் சிரித்துக்கொண்டான் .'இன்னும் காதலையே சொல்லவில்லை. இதற்குள் மாமா,மாமி என்று சொந்தம் வேறு ' என்று நினைத்திருப்பான் போலும் .","\"இராகுல் !இராகுல்!\" என்று கல்யாணி கூப்பிடும் சத்தம் கேட்டது","“என்னம்மா?” என்று கேட்டான்","\"பிரேக்கிங் நியூஸ் போகுது .வந்து பாரேன் !\"","இராகுல் அவசரமாக வெளியே வந்தான்.","\"நாடு பூராவும் ஊரடங்கு தளர்த்தப்படுகிறது .பல்கலைக்கழகங்கள் இறுதியாண்டு மாணவர்களுக்கு மட்டும் அடுத்த வாரம் ஆரம்பிக்கப்படும் \"","\" மூத்தவர் சம்மதியில் வதுவை முறைகள் பின்பு செய்வோம்","காத்திருப்பேனோடீ இது பார் கன்னத்து முத்தமொன்று....\" என்று இராகுலின் உதடுகள் அவனறியாமலே முணுமுணுத்தன."],"w":927,"ic":"lantern"},{"t":"சீதா கல்யாண வைபோகமே","b":["கயிலாயத்தில் வெண்பனி சூழ்ந்திருந்தது .முப்புரம் ஏறி செய்த அச்சிவனும் மனம் குளிர்ந்தான் .அருகில் சக்தி அமர்ந்திருந்தாள் .ஆனந்தம் அவள் மனதில் பெருகிற்று.காரணம் அறிந்திலாள். அவள் உடனே தன் தாண்டவத்தை ஆரம்பிக்கிறாள் .சிவனும் அதில் மனம் இலயிக்கின்றான்.கூடவே அவளுடன் அவனும் இணைந்து ஆடுகிறான்.நாட்கள்,வாரங்கள்,மாதங்கள்,வருடங்கள் என்பதை கடந்து யுகங்கள் தாண்டியும் தாண்டவம் தொடர்ந்தது.இருவர் மனதிலும் அந்த ஆனந்தம் பல்கி பெருகி உருவம் பெற்றது.அதை தன் சடையில் மறைந்திருந்தும் கங்கையினுள் ஒழித்து வைத்தான் ஈசன் .கங்கையோ தன்னோடு கலந்ததால் காதல் என்று பெயர் சூட்டினால் அதற்கு .சிவன் யோகத்தில் ஆழ்ந்த வேளையில் காதலால் மயக்கமுற்று கங்கை அதை தன்னுடைய பாதையெங்கும் படர விட்டாள்.கங்கையை பருகிய உயிர்கள் அனைத்தும் காதலால் தம் கடமையை மறந்தன . சிவனும் கோபமுற்று மேகக்கூடங்களின் மேலே காதலை சிறை வைத்தான் .இதை அறிந்த மன்மதன் வில் கொண்டு அதை சிறை மீட்டான்.உடனே அவனது பாணங்கள் அனைத்தும் மலர்ப்பாணங்கள் ஆகின.தன் அம்பின் நுனிகளை காதலின் சாரத்துளிகளில் நனைத்து எடுத்தான்.அந்த சரங்கள் பாய்ந்த நெஞ்சில் எல்லாம் காதல் விழைந்தது.அப்படி ஒரு சரம் தான் சீதையையும் தாக்கியது","மாடத்தில் இருந்தவாறே வருகின்ற அரசிளங்குமாரர்களினை பார்த்து கொண்டிருந்தாள் சீதை.அவளை யார் தடுக்க இயலும்.விதேகத்தின் வைதேகி அல்லவா அவள்.அவள் அதிகாரம் ஆண்டவனுக்கு நிகரானது .எனவே தோழிகள் தடுத்தும் கேளாமல் மாடத்தில் நின்றவாறே வேடிக்கை பார்த்து நின்றாள்","வந்துகொண்டிருந்த அனைவரும் அவளிலும் வயதில் மூத்தவர் .வயதான அரசர்களும் அவளை பெண் கேட்டு வருவதை பார்த்து அவளுக்கு நகைப்பாக இருந்தது .வந்தவர் சிலர் மேலே நோக்கி அவளை பார்த்தனர் .கண்டதும் சிலர் நாணத்திழும் சிலர் பயத்திலும் மண்ணை நோக்கினார் . எரிச்சலாக இருந்தது .கண்ணை நோக்கும் திறன் அற்றவனா நாளை அவளை காதலுடன் நோக்கபோகிறான் ?.இவர்களில் எவரேனும் நாளை என்னை மணந்தால் என் செய்வேன் என்று கவலை கொண்டது அவள் மனம் .","அந்த வேளையில் அங்கொரு இளைஞன் வந்தான் .அவன் மேல் உடுத்தியிருந்த பட்டுச்சால்வை அவன் வழு வழுப்பான தேகத்தின் செழுமையால் நழுவி விழாது அவன் தினவெடுத்த தோள்கள் தாங்கி நின்றன .அவன் நடையில் வீரம் தெரிந்தது .அவன் முதுகில் இருந்த அம்பாறத்தூளி இருக்க பிணைந்திருப்பதை கண்டாள் .போர் ஒன்றை முடித்து அவன் வந்திருப்பதை உணர்த்திற்று .கையில் அவன் உறுதியாக அந்த வில்லை பற்றியிருந்தான்.ஆனாலும் அந்த பிடியில் வலியில்லை. பெண்ணொருத்தியை லாவகமாக பிடித்திருப்பதை போல் இருந்தது .அவன் தேகத்தில் ஓரிரண்டு வடுக்கள் இருந்தன. இன்னும் இவன் ஆயிரம் போர்களை காணவிருப்பதை உணர்த்தும் குறிப்பாய் இருந்தது.அவன் நெற்றியில் சூரிய திலகம் இட்டிருந்தான்.அந்த திலகத்தின் தேஜஸை காட்டிலும் சூரியன் சற்று பிரகாசம் குறைந்திருந்ததை போல் இருந்தது.","திடீரென அவன் மாடத்தை நோக்கி பார்க்க அவளும் அவனையே பார்த்தாள்.அந்த கணம் மன்மதனின் சரம் அவளை தாக்கியதை உணர்ந்தாள்.அவன் பார்வை எங்கெல்லாமோ செல்வதை உணர்ந்தாள்.நிலைகுலைந்தாள்.வந்த நாணத்தில் அரண்மனைக்குள் ஓடி சென்றாள்.","அந்த க்ஷணமே அவர் தான் என் கணவன் என்று மனதில் வரிந்து கொண்டாள்.","தோழியரிடம் அவரை பற்றி வினவினாள்.ஆம் ! அவன் அவராகி போனார்.இராமன் என்பது நாமம் என்றனர்.இரகு குலத்தோன்றல் என்றனர்.அதற்கு பிறகு அவள் காதில் எதுவும் விழவில்லை .இராம என்ற நாமமே அவள் உள்ளும் புறமும் நிறைந்தது.கற்பனைஓடத்தில் மிதந்தவளுக்கு நினைவு தட்டியது .தந்தையின் ஆணைப்படி சிவதனுசை தூக்கினால் தானே அவர் வரனாக முடியும் என்ற உண்மை அவளுக்கு நிதர்சனமானது .செய்வதறியாது நின்ற சீதை சிவதனுசுவையே சரண் அடைய முடிவு செய்தாள் .மலர்ப்பேழையில் நாளைய சுயம்வரத்திற்காய் தயார் நிலையில் இருந்தது அந்த வில் .ஈசனின் புஜங்கள் போல பராக்கிரமமாக அது இருந்ததை கண்டாள் .கரம் தொட்டு கண் மூடி மனதார தொழுதாள் அவள் .","கண்விழித்து பார்க்கையில் எதிரே ஒரு சிறுமி இருப்பதை கண்டாள் சீதை.யார் நீ? என வினவினாள் .நீதான் நான் என்றாள் அச்சிறுமி .என் சிறுவயதில் உன் போல் நானிருந்தேன் என்று சீதை கூறினாள் .உன் பால்ய பருவம் தான் நான் என்று அவளும் பதிலளித்தாள. சீதைக்கு புரியவில்லை .சிறுமி பேசினாள்.","ஜனகராஜன் உன்னை பூமியில் கண்டெடுத்தான்.உனக்கு பூமிஜா என நாமம் சூட்டினான்.விதேகத்தில் பிறந்ததால் வைதேகி எனப்பட்டாய் .ஜனகன் மக்கள் ஆனதால் ஜானகி எனப்பட்டாய். ஆனாலும் சீதள பூமியில் விளைந்ததால் கொண்ட சீதை என்ற நாமமே அனைவர் மனதிலும் பதிந்து போனது.உன் பிறப்பால் விதேகம் தழைத்தது செழுமை கண்டது .மகிழ்ந்த ஜனகன் உன்னை தன் மகளாக சுவீகரித்து கொண்டான் .ஆனாலும் பெண்ணாக பிறந்தவள் வேறு இடம் செல்வது கட்டாயம் அல்லவோ.எனவே நீ காலம் முழுக்க கலங்காது இருக்க வரன் வேண்டும் என்று முடிவெடுத்தான் ஜனகன்.","ஆண்டுகள் பலவாக அவன் குலத்தில் நான் இருந்து வந்தேன்.அவன் முன்னோர் தவப்பயனால் கிடைத்தது என்று பேசினர் .என் தோற்றம் பற்றி யாரும் அறிந்ததில்லை .அப்படி இருக்கையில் ஒருநாள் நீ என்னை தூக்கி விளையாடுவதை ஜனகன் கண்டான் . மனக்கிலேசங்கள் அற்ற தூய உள்ளங்களால் தான் என்னை தூக்க முடியும் என்பது எனக்கு விதிக்கப்பட்டது.அப்போது ஜனகன் மனதில் சிந்தனை ஒன்று தோன்றியது.என்னிடம் வந்து பிரார்த்தனை செய்தான்.உன் கரம் பற்றும் மணவாளனை ,காலம் முழுவது உன்னை கா .படைக்க மட்டுமே தெரிகிறது அவனுக்கு. சிருஷ்டி விரிகிறது. பிரமாண்டமாகிறது.நட்சத்திரங்கள் பிறக்கின்றன.கோள்கள் பிறக்கின்றன.பஞ்ச பூதங்கள் பிறக்கின்றன.அவனுக்கு ஒரு ஆசையும் பிறக்கிறது.அந்த ஆலிலை கேசவனின் சயனத்திற்கு இணையாய் உணர்த்தும் வகையில் நாற்புறமும் நீர் சூழ தீவமைத்தான் .அந்த அனந்த சயனின் உடல் மேல் ஒரு சேர உஷ்ணத்தையும் குளிர்மையும் உணர்கிறான் அவன் .எனவே ஒரு சேர மழையும் வெயிலும் வரச்செய்தான்.நாபிக்கமலம் மேல் நோக்கி உயர்ந்தது போல் விசும்புயர மலைத்தேசம் அமைத்தான்..தன்னிலிருந்து பிறக்கும் பல்லாயிரம் உயிர்கள் போலும் மேகதூதர்களை மலை முகடுகளில் முட்டச்செய்து நீர் துளிகளை பிரவாகமென நாற்புறமும் ஓடச் செய்தான் .நீர் பசுமையையும் செழுமையையும் வாரித்தந்தது .பசுமையின் கண் உயிர்கள் பிறந்தன.பிறந்த உயிர்கள் தம் பூமிக்கு ஆயிரம் திருநாமம் சூட்டி மகிழ்ந்தன.கால ஓட்டம் அவற்றில் பலவற்றை தன்னுடன் கூட்டிச் செல்ல மிகுதியாய் எஞ்சியவற்றில் இலங்கை எனும் நாமம் சூட்டி மகிழ்ந்தன அவ்வுயிர்கள்.","வடக்கே கேரளத்து வாசம் வீசும் செந்தமிழ் காற்று முட்டுகையில் தெற்கே ஆரியத்து சிங்களமும் மணம் கவிழும்.ஆங்காங்கே மழைச்சாறல் என தூவப்பட்ட ஆங்கில வார்த்தை ஜாலங்களும் உள்ளடங்கும்.எங்கோ பிறந்த புத்தன் இங்கே தன் தலம் அமைத்தான்.சிருஷ்டியின் இரகசியங்களை தானறிந்து பலர் சிந்தனைகளில் உலவ விட்டான்.புத்தம் பௌத்தம் ஆனது.பௌத்தம் தர்மமானது.அந்த தர்மத்தின் அத்திவாரத்தில் இலங்கை மேலே எழுந்து நின்றது.","இயற்கை என்னும் இளமடந்தை காதலின் மிகுதியால் இலங்கையை தன் கரங்களால் வாரியணைத்தாள்.அவள் நெருக்கத்தின் மிகுதியால் தனங்களில் இருந்து முலைப்பால் வழிந்தோடிய இடமெல்லாம் வனச்சோலைகளாகின .நெருக்கம் கூடவே உஷ்ணமும் தந்தது .அவளின் மூச்சுக்காற்றின் சூடு தாங்காமல் சில இடங்கள் வறண்டு போயின .வறட்சி கண்டு மனக்கவலையுற்று முத்த துளிகளை அவள் பரிசளிக்க அங்கிருந்து முளைத்தெழுந்தந ஓரிரு மரங்கலும் புல்வெளிகளும். இந்த காட்சியை தன் மனக்கண்ணாடி முன் அடிக்கடி நிறுத்திய வருணனும் வாயுவுடன் இணைந்து இதை எண்ணி எண்ணி அகமகிழ்ந்து நடனமிடுகிறான் .நடனத்தின் நீட்சியாய் மழையும் புயலும் வீசுகிறது.","கொஞ்சும் சலங்கை அணிந்த குமரிகளின் கெஞ்சல் குரல் கேட்டு இந்திரனும் கற்பகதருவை அனுப்பி வைத்தான்.பலவகை பலன்களை நெடுங்காலம் தந்ததால் அது பனையாயிற்று .கூடவே வந்த காமதேனு ஆநிரைகளாக பெர ம் இல்லையெனினும் பலசமயம் மனதின் இடுக்கெங்கும் எதிரொலிக்கும் .","இருபது நிமிட இடைவேளை நேரத்தில் விளையாடி மகிழ்ந்தவன் என்று நான் பொய் கூறப்போவதில்லை.உண்மை விளம்பியாய் இல்லை என்று ஒத்துக்கொள்கிறேன்.எனினும் என் கண்கள் கண்ட காட்சிகளுக்கு சாட்சி பூதமாய் பதிவு இடுகிறேன்.சாப்பிடவே போதாத அந்த நேரத்தில் பிளாஸ்டிக் போத்தல் காற்பந்தாய் மாறிவிடும் அதிசயம் கண்டிருக்கிறேன்.இராமநாதன் கல்லூரி பக்கம் அமைந்த வாசலருகே இருந்த பெவிலியன் நோக்கி செல்லும் வெள்ளை சீருடைகள் எல்லாம் மதியம் மண்நிற மழைச்சாரலில் நனைந்து வரும் .கொப்பியின் பின்பக்கங்களும் செல்லோடேப் உம் இணைந்தால் கிரிக்கெட் பந்து தயார் .பின்புற மேசைகளின் பலகைகள் பிளந்து வருவதன் இரகசியம் அந்த நேரத்தில் புரியும் .காத தூரம் தாண்டியும் பறக்கும் அந்த காகித பந்துக்கு அஞ்சித்தான் இடைவேளையில் ஆசிரியர்களும் staff room ஐ நிறைத்துக்கொள்வார்கள் போலும்.","இன்னும் சொல்ல நிறையவே உண்டு . ஆலமர நிழலில் படித்திட்ட பாடங்கள்;ஐப்பசி மழையில் முழங்காலையும் மூழ்கடித்த வெள்ளம்;60 ஆம் ஆண்டு வைரவிழா என கோர்வையாய் அடுக்கி சொல்ல ஆயிரம் கதை உண்டு.ஆனால் அவை எல்லாம் அனுபவத்தால் மட்டுமே இரசிக்க கூடியவை .வார்த்தைகளால் எவ்வளவு வர்ணம் தீட்டினாலும் கால ஓட்டத்தில் அவற்றின் அர்த்தம் கரைந்து போய்டும்.எனவே அவற்றை கண்டவர் நினைவுக்கே காட்சிகளாய் மீதம் விடுகிறேன் .","ஒரு தாய் மக்கள் நாமாவோம் .ஒன்றே எமது குலம் என்போம் .இதை உணர்த்தி நின்றது என் கல்லூரி.ஆங்கிலத்தில் 13 அதிர்ஷ்டம் குறைந்த எண் என்பர் .எனக்கோ அந்த 13 வருடங்களும் தான் அதிர்ஷ்டத்தை அள்ளித்தந்த காலம்.என் பள்ளியில் நான் முதல் முதல் கால் எடுத்து வைத்த நாளும் எனக்கு நினைவில் இல்லை .இறுதியாக வெளியே கால் வைத்து வெளியேறிய நாளும் நினைவில் இல்லை.ஆனால் ஒருக்கால் இன்று சற்றே வாழ்வில் ஒரு உயரத்தை எட்டி பிடிக்க எத்தனிக்கின்றேன் என்றால் அதன் ஏணிப்படி இன்றளவும் நிற்பது அவள் நெஞ்சினில்.","காக்கைக்கும் தன்குஞ்சு பொன்குஞ்சு என்பர்.என் கல்லூரித்தாய்க்கு நான் வேண்டுமானால் பொன்குஞ்சாய் இல்லாமலும் போகலாம். ஆனால் எனக்கு அவள் காக்கை அல்ல;கருநாக மாணிக்கம்.மறுஜென்மம் உண்டெனில் உன் மகனாய் மீண்டும் என சொல்ல எனக்கு உடன்பாடு இல்லை. இந்த ஒரு ஜென்மம் அவளடியில் தவழ்ந்தது போதும். ஓராயிரம் தவங்களின் பயனை அடைந்துவிட்டேன்."],"w":794,"ic":"book"},{"t":"தேறல்","b":["கதிரவனின் கீற்றொளிகள் மேகங்களை ஊடுருவி மணற்றரையில் வீழ்ந்தன.அவற்றிலிருந்து லாவகமாக தப்பி விரல்களை நிழலுக்குள் இழுத்துக்கொண் டான் .நிழலில் இருந்துகொண்டு ஒளியை ரசித்தான் அவன்","கதிரொளியில் இருந்து தப்பித்தவன் கடலலையில் இருந்து தப்பவில்லை .அவன் கால்களை நனைத்து சென்றது கடல்.","வானம் அவனை பார்த்து நகைப்பதாக தோன்றியது.கடலில் இருந்து மட்டுமா அவன் தப்பவில்லை ?","முதுகில் ஒரு அடி .","திரும்பி பார்த்தான்.பின்னுக்கு அவள் சிரித்து கொண்டிருந்தாள்.அவள் தான்.அவளே தான்","“இப்படி தான் யார் வாரங்க எண்டு தெரியாம கடலையே பாத்துட்டு இருப்பியா……...அஞ்சு மணிக்கு தானே வர சொன்னேன் ...எதுக்கு இவ்வளவு சீக்கிரமா வந்து இருக்க ..இன்னும் அரை மணி நேரம் இருக்கு….”","“அது வந்து….”","ஊதா நிற அந்த சல்வாரில் வானத்திற்க்கே புது வண்ணம் கொடுத்தாள் அவள் . கூந்தலை முடியாமல் வழமை போல் விரித்து விட்டிருந்தாள்.ஓரிரு கற்றைகள் கற்றைகள் மட்டும் காற்றின் வேகம் தாங்காமல் பறந்துகொண்டிருக்க கைகளால் சரி செய்தபடியே வந்து அருகில் அமர்ந்தாள்..அந்த கண்கள்……….","“என்னடா ஒண்ணும் பேசாம முழிச்சிகிட்டு இருக்க ..சரி வந்துட்ட ..வா இதெல்லாம் இங்க அரேன்ஜ் பண்ண ஹெல்ப் பண்னு ...மகிழ் இன்னும் 10 நிமிசத்துல வந்துடுவானாம்”","வெறும் பத்து நிமிஷம் தானா .இன்னும் கொஞ்சம் லேட்டா வரக்கூடாதா ? ..இதுக்குத்தான் இவ்வளவு சீக்கிரம் வந்தேனா !","“என்னடா !!.முதல் இத பாக்சில போடு “","அவன் அப்போதுதான் நனவுலகத்துக்கு வந்தான். “இரு! இரு !ஒரேடியா எல்லா வேலையும் சொல்லாத!! ..ஆறுதலா செய்யலாம் !”","“ஆமை வேகத்துல செஞ்சா அவன் வந்த பிறகுதான் எல்லா வேலையும் முடிக்கணும்”","அவளின் தொலைபேசி திடீரென ஒலித்தது.அவள் பேசியவாறே நடந்து போனாள்.","அந்த ஈர மணலில் அவளின் காலடித்தடங்கள் ..செவ்வந்திப்பூவில் எறும்புகள் கால் பதித்தாற் போலும் நோகாமல் நடந்தாள் .இருந்தும் அவளுக்காகவே காத்திருந்தது போல மணற்றரை அவளை தனக்குள் இழுக்க பார்த்தது . இவளோ அதற்குள் பாதங்களை உயர்த்தி விட்டாள் ...ஏமாற்றத்தின் காயங்களை சுமந்த தரைக்கு கடல் தன் அலைகளால் ஆறுதல் சொன்னது","பேசி முடித்துவிட்டு ஒரு வித ஏமாற்றத்துடன் வந்தாள் .","“என்னாச்சு?”","“மகிழ் தான் பேசினான் .வாரத்துக்கு இன்னும் கொஞ்சம் டைம் ஆகுமாம்.வெயிட் பண்ணட்டாம்.சரி, வா நாங்க வேலைய பார்ப்போம்”","“ம்ம்ம்ம்” …..அப்பாடா இன்னும் கொஞ்ச ந {"t":"வீசா பிள்ளையார், விசாகப் பிள்ளையார், ஐ.பி.சி பிள்ளையார்","b":"வெள்ளவத்தையின் ஊறிப்போன அடையாளங்களுள் ஒன்று வீசா பிள்ளையார். ரிஷி மூலம் தேட முடியாது என்பது போல பிள்ளையாரின் மூலமும் எனக்கு இன்னமும் பிடிபடவில்லை. சுனாமியில் மிதந்து வந்தவர் என்றொரு கர்ணபரம்பரைக் கதை. ஆனால் அண்மையில் நான் வாசித்த பதிவு, அவர் அதற்கும் முந்தியவர் என்று சொல்லியது. சுனாமியில் நிறைய தெய்வங்கள் மிதந்த கதை உண்டு. அதன் நீட்சி இவருக்கும் நீட்டப்பட்டிருக்கலாம். 'சுனாமி பிள்ளையார்' என்றும் ஒரு பெயர் உண்டாம். சுனாமி வந்த போது பிள்ளையாரைத் தீண்டாமல் சென்றதாய் இன்னொரு ஆச்சி சொன்னார். இது பிள்ளையாருக்கே தான் வெளிச்சம்.\n\nஇன்றைய தலைமுறையினர் பலருக்கு இவர் விசாகப் பிள்ளையாராகவே தெரியும். ஆனால் அது 'வீசா' மருவி 'விசாகம்' ஆன கதை தெரிந்திருக்க வாய்ப்பில்லை. யுத்த காலத்தில் நாட்டை விட்டு ஓடிய காலம். காத்திருந்து காலம் போன அனைவருக்கும் வீசா பிள்ளையாரின் அருமை தெரியும். பிரதி வெள்ளிதோறும் கோவில் பயங்கர களை கட்டும். கோவில் அமைப்பைப் பற்ரி சொல்ல மற்ந்துவிட்டேன் .கோவிலைப் பற்றிச் சிறிது பார்த்து விட்டு வருவோம்.\n\nஅளவில் சிறிய கோவில். முறிகண்டி பிள்ளையார் எவ்வளவோ மேல். இவர் குறுகிப் போன சின்ன இடத்தில் கடல் பார்த்து குந்தியிருப்பார். பக்கத்தில் நாகதம்பிரான். அவ்வளவும்தான் கோவில். இப்போது புதிதாய் கதிர்காம கந்தன் அடைக்கலம் அருகில். வெளியே படலையைத் தாண்டி கற்பூரத் தட்டும், விபூதி, சந்தன, குங்குமம் இருக்கும். காலை அபிஷேகம், பூஜை. மாலை அலங்காரம், பூஜை. வெள்ளிக்கிழமை வெகு விசேஷம். மோதகம், அவல், கொழுக்கட்டை, கடலை எனப் பிரசாதம் எல்லாம் குவியும். அவை அனைத்தையும் ஆசையாய் பார்த்தபடி நாமிருக்க, மூடி திறந்து பிள்ளையாருக்கு  தீபம் காட்டி, தண்ணீர் தெளித்து பூஜை முடியும். அதன் பிறகு பிள்ளையார் அதோ கதியாய் தனித்திருக்க, வெள்ளவத்தை சனம் இன மத பேதமின்றி பிரசாதத்திற்காய் முண்டியடிக்கும். நான் சிறுவயது முதல் கஸ்டமர் என்பதால் முண்டியடிக்காமல் ஓரமாய் நின்று கிரசாம்பாள் மாதிரி பிரசாதம் எனக்குக் கிடைத்துவிடும்.\n\nநிற்க. இப்படித்தான் ஒவ்வொரு வீசா அங்கீகாரங்களும் பிரசாதமாய் அந்நாளில் குவியும். இதனாலேயே பிள்ளையார் 'வீசா பிள்ளையாராய்' போனார். பின்னாளில் நாடு செழிக்க, வீசா வேண்டுவோரும் குறைய, பிள்ளையார் 'விசாகப் பிள்ளையார்' ஆனார். ஆனால் பக்தியும் சக்தியும் குறையவில்லை. நான் கூட வியட்நாம் சுற்றுலா வீசா கிடைக்காமல் இருக்க, 50 ரூபாய் உண்டியலில் போட்டுக் கும்பிட்டு வீசா எடுத்திருக்கிறேன் (இதில் இன்னொருத்தன் வீசா பிழைச்சு, தனியா போக இருந்த எனக்கு அவனைத் துணையா அனுப்பினது வேற கதை).\n\nபிள்ளையார் இருக்கும் வீதி பெயர் ஐ.பி.சி (IBC) வீதி. அங்கு சர்வதேச பௌத்த மத்திய நிலையம் இருப்பதால் அப்பெயர். அதனால் பிள்ளையாரும் 'ஐ.பி.சி பிள்ளையார்' ஆனார். வஜிராராமய விகாரை இருக்கும் வஜிர வீதி பிள்ளையார், 'வஜிரா பிள்ளையார்' ஆன கதை போலத்தான் இதுவும். புத்தருக்கும் பிள்ளையாருக்கும் ஏதோ ஒரு பந்தம் போலும். எந்தப் பொல்லாப்பும் வேண்டாம் என்று தன் பாட்டுக்கு அரச மரத்தடி தேடியது காரணமாகலாம்.\n\nஇன்றும் வெள்ளவத்தை சமூகத்தின் தஞ்சம் அவர்தான். புதிதாய் ஆஞ்சநேயர், அம்மன், சிவபெருமான் எனப் பலர் உதித்தாலும், பெரும் ஆகமக் கோவில்கள் வளர்ந்தாலும் பிறந்த நாள், பயணம், வருடப்பிறப்பு என அனைத்தையும் அவரிடம் ஆரம்பிக்கும் ஒரு சமுதாயம் இன்னமும் ஜீவிக்கிறது.\n\nஅச்சமுதாயத்தின் நீட்சியாய் நானும்,\n\nதுங்கக் கரிமுகத் தூமணியை வேண்டி நின்றபடி...","pr":1,"ic":"temple","g":"பயணங்களும் இடங்களும்"},{"t":"பயணம் முடியும் பயமும் விட்டுப் போகாதோ…","b":"சந்திக்காத கண்களில் இன்பங்கள்\nசெய்ய போகிறேன்\nசிந்திக்காது சிந்திடும் கொண்டலாய்\nபெய்ய போகிறேன்\n\nசித்தார்த்- நித்யாமேனன் நடிப்பில் வெளிவந்த 180 படத்தின் பாடல் வரிகள் இவை.எனை ஏதோ வகையில் கவர்ந்த படம். நித்யா மேனன் ஒருவரே போதும். ஆனால் சித்தார்த் நடிப்பையும் அதிகம் நான் இரசித்த படம்..அனைத்தையும் தாண்டி என்னைக்கவர்ந்தது கதையின் கரு… ஒரு குணப்படுத்த முடியாத நோயினால் பாதிக்கப்படும் மருத்துவன்.. அவனுடைய தினசரி வாழ்க்கை, உறவுகள் , தொழில் என அனைத்திலும் அவன் மரணம் பயமாய் உருவெடுத்து நிற்கிறது.. மரணத்தை காட்டிலும் அதன் மீதான பயம், அவனை சூழ்ந்தவர்கள் கொள்ளும் பயம் அவனை பலமடங்கு அழுத்தத்திற்கு உள்ளாக்க , தனது எஞ்சிய வாழ்வை மாற்றியமைக்க நினைக்கிறான். தனது அடையாளம் அனைத்தையும் துறந்து பூமிப்பந்தின் புது மகவென 180 நாட்கள் மகிழ்ச்சியான வாழ்வை நோக்கி பயணிக்கின்றான்\n\nநிற்க.. இது அனைவருக்கும் சாத்தியமானதா என்று கேட்டால்.. இல்லை.. உறவுகள், பொறுப்புக்கள் அனைத்தையும் உதறுவது அசாத்தியமானது.. பொருளாதாரம் , உளவியல் என அனைத்திலும்

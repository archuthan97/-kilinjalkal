 தன்னும் காதலிக்காதவர்  உண்டா\n\nஎன்னை பொருத்தமட்டில் காதல் என்பது அழகிய கவிதை .காலம் போனாலும் கவிதை அழகு குறைவதில்லை . ஆனால் இரசனை குறைந்துவிட்டால் காதலின் அழகு மங்கி போகும்\n\nகாதலியுங்கள்\n\nகாலம் முடியும் வரை","pr":1,"ic":"flower","g":"எண்ணங்களும் சிந்தனைகளும்"},{"t":"ஒருவரின் உணர்வுகள் தாய்மொழியில்…","b":"ஒருவரின் உணர்வுகள் தாய்மொழியில் அன்றி முழுமையாக வேறொரு மொழியில் வெளிப்பட முடியாது என்பதை நம்புபவன் நான் . எனவே தமிழில் இப்பதிவு\n\nஆறுவருடங்கள் என்பது நீண்ட நெடிய பயணம் . இளமையின் பெரும்பகுதியை தியாகிக்க வேண்டிய கட்டாயம் .வைத்திய பீடம் நுழைந்தாலே மருத்துவன் என்று சிலாகிக்கும் சமூகத்தில் இருந்து மருந்துகளும் மருத்துவமும் அது சாரி நிருவாக அரசியல் என புது உலக பிரவேசம் . நீ  மருத்துவன் ஆக வேண்டுமென்றால் 50 இற்கு மேற்பட்ட பரீட்சைகளில் 50 ற்கு மேல் எடுத்து சித்தி அடைய வேண்டுமென்று முதல் ஆணியை எங்கள் பெரும் பொருளாளர் அறைய அடுத்தால் போல் வந்த சிரேஷ்ட மாணவர்களும் வருடத்தில் இரு வாரம் மட்டுமே விடுமுறை என்று அடுத்த ஆணியை அறைந்து காலாளரிப்பெட்டியை மூடினார்கள் . ஆம் . அடுத்து வந்த சில மாதங்கள் உயிர் துறந்த  உடலின் பயணமாகவே இருந்தது . மொழிசிக்கல் ,மனச்சிக்கல் , பண சிக்கல் என எல்லாவற்றுடனும் 13 ஆண்டுகளில் நான் காணாதவாறு படிப்பும் சிக்கலாய் போனது . “போகாதே” என்று சரஸ்வதி கானம் பாட வேண்டி வரவும்   உடைந்து போய் விட்டேன் . அதில் ஒழுகிய காவிரியும் கங்கையும் அம்மாவின் மடி சொத்து\n\nபள்ளிகாலத்தில் நட்பு வட்டத்தை ஒரு வட்டம் தாண்டி வைத்து பழகி விட்டேன் . பல்கலைகழக நட்பு வட்டம் பெரிதாக இருந்த போதும் அது மகிழ்ச்சியை மட்டும் பரிமாறும் வட்டமாக இருந்ததால் சோகங்களை பரிமாறுவதில் சிறு நெருடல் .உளப்போராட்டம் இறுதியில் சில உதவும் கரங்களால் வெற்றி கண்டது . இந்த ஆறுவருடங்களில் பலரிடம் ஆறுதல் கண்டிருக்கிறேன்.அழுகை ,அவமானம், ஏமாற்றம் ,பயம் , சந்தேகம் , குழப்பம் .கோபம், வெறுப்பு என எதிர்மறை உணர்வுகளின் குவியலாய் நான் இருந்த நாட்கள் மிக அதிகம் .அதில் குலைந்து போகாது காத்தோர் சிலருக்கு வாழ்நாள் நன்றிகள்\n\nஎன்னை படிப்பிலும் மனதிலும் செம்மை செய்தது நான் மருத்துவமனையில் செலவழித்த மணித்துளிகள் .முதுமையால்   தன்னிலை மறந்த மூதாட்டியை பார்த்து அழுத நான் ஆறு வருட முடிவில் என் வீட்டு மரணத்தையும் ஏதுமிலாது எதிர்கொண்டது துறை சார் பட்டறிவு - அந்த மணித்துளிகளை என்னோடு பகிர்ந்த வைத்தியசாலை நோயாளிகள் - வானுறையும் தெய்வத்திற்கு நிகர்\n\nஏதிலியாய் இருந்தவனிற்கு இன்று ஏதாகினும் இயலும் எனில் காரணமாய் இருந்த ஆசிரியர்களுக்கும் நன்றிகள்\n\nமறவா நன்றிகள் மறந்தோருக்கும்","pr":1,"ic":"pen","g":"எண்ணங்களும் சிந்தனைகளும்"},{"t":"ஒரு நாள் இரவு","b":"பகல் போல் நிலவு\n\nகனவிலே என் தாய் வந்தாள்\n\nசௌகார் ஜானகி இயக்கி நடித்த படத்தில் வந்த ஒரு சோக பாடல்\n\nஒவ்வொரு வரியிலும் தாயை இழந்த மகளின் சோகம் இழையோடும். அந்த சோகத்தை திரையில் கடத்திய அந்த கண்கள் இன்று நிரந்தர துயிலில்\n\nசௌகார் படம் நான் பார்த்ததில்லை. அவரை எனக்கு அறிமுகம் செய்த படம்- இரு கோடுகள். ஒரு கணவனுக்காய் போராடும் இரு மனைவிகள். கணவன் குமாஸ்தாவாய் இருக்கையில் மனைவி கலெக்டர். இத்தனை குழப்பங்களையும் திரையில் நம் கண் முன்னே கொண்டு வருவார். கறுப்புக்கண்ணாடி பின் கலங்கிய கண்களுடன் - அந்த ஜானகி தான் பாமாவிஜயத்தில் கலகலப்பான பாத்திரத்தில். மேஜர் சுந்தர்ராஜனை சந்தேகிப்பது, குடும்ப கலகத்திற்கு பிள்ளையார் சுழி போடுவது என தன் பங்கால் கதையை செழுமை செய்தார்\n\nஇப்படியாக பல கறுப்பு வெள்ளை படங்களில் கலக்கியவரின் வண்ணப்பட புகழ் காவியம் - புதிய பறவை. ஒரு மேலைத்தேய மோகம் கொண்ட பெண்ணாக பார்த்த ஞாபகம் இல்லையோ என்று சுசீலாவின் குரலில் நடித்த பாடல் அவரின் துறையின் உச்சம்\n\nதில்லு முல்லு படத்தில் ஒரு குணச்ச்சித்திர பாத்திரத்தில் மீண்டும் ஒரு வரவு- வரவு எட்டணா என பாடலில் இருந்த அதே துள்ளல் குறையாமல்.\n\nநவீன யுகத்தில் அவர் திரைத்துறையை தவிர்த்தார் என்றே எண்ணுகின்றேன் . பின்னாளில் தான் அவர் கைக்குழந்தையுடன் கதா நாயகியாய் நடிக்க வந்தவர் என அறிந்தேன். ஐந்து தலை முறைக்கு மேல் தனி வாழ்வில் கண்ட ஆந்திர மாணிக்கம்\n\n“வானத்தில் இருந்தே பாடுகிறேன்\n\nஎந்த வழியிலும் உன்னைத் தேடுகிறேன்\n\nமகளே வாழ் என வாழ்த்துகிறேன்\n\nநான் மறுபடி பிறந்தால் சேர்ந்திருப்பேன்\n\nமறுபடி பிறந்தால் சேர்ந்திருப்பேன்”\n\nமறுபடி பிறந்தால் மீண்டும் திரைக்கு வந்து விட வேண்டும்\n\nஇன்று அந்த மாணிக்கம் துயில் கொள்ளட்டும்","pr":1,"ic":"moon","g":"எண்ணங்களும் சிந்தனைகளும்"},{"t":"ஆல்ஹகோல் அனோனிமசஸ்","b":"குடி குடியை கெடுக்கும்\n\nகுடிப்பழக்கம் நாட்டுக்கும் வீட்டுக்கும் கேடு\n\nதமிழ் சினிமா உதிர்த்துவிட்ட தத்துவ வார்த்தைகள் இவை. ஆனால் இவை அனைத்தும் வார்த்தைகளில் அடங்கிப்போனதுதான் சோகம். மது கலாசாரம் தாண்டி உலகெங்கும் பரவி விட்ட காலன். இன்றைய நூற்றாண்டில் குடியை இழிவாக நோக்கும் சமுதாயம் ஒன்று இருந்தாலும் இளம் சமுதாயத்தில் குடிப்பது என்பது ஆண்மையின் வெளிப்பாடு அல்லது ஒரு வீர தீர செயல் அல்லது களிப்பின் உச்சமாக நோக்கப்படுகிறது. குறிப்பாக படித்தவர் சமுதாயத்தில் கேளிக்கை விருந்துகள் மதுவின்றி முடிவதில்லை.\n\nபல இல்லங்களில் மது முன் தலைமுறையால் இளைய தலைமுறைக்கு பரிசிலாக வழங்கப்படுகிறது. break the chain என்ற வகையில் அதை உடைப்பதுதான் கடினமாக உள்ளது. வீட்டாராலேயே அங்கீகரிக்கப்பட்ட ஒன்று அடுத்த தலைமுறையில் தவறு என உரைக்காது. அந்த தலைமுறை தாக்கம் அறியாதவர்கள் gifted people.\n\nமனித நாகரிக வளர்ச்சியுடன் மதுவும் தோன்றியிருக்க வேண்டும். பொது ஊழிக்கு 7000 ஆண்டுகள் முற்பட்ட அரிசி, தேன் கலந்த மது பானம் சீன தேசத்தில் கண்டறியப்பட்டுள்ளது. மதுவும் மனிதனும் சேர்ந்தே வளர்ந்த கதைக்கு இதுவே சாட்சி. இது போல ஈரான், மெசபடோமியா, எகிப்து என பண்டை நாகரிகங்களில் மதுக்குடுவைகள் கண்டறியப்பட்டுள்ளன.\n\nதமிழர்கள் ஒன்றும் சளைத்தவர்கள் அல்லர். சங்க பாடல்களில் பலவகையான கள் பற்றிய குறிப்புகள் உண்டு. அவ்வைப்பாட்டி கூட பாரியுடன் கள்ளு அருந்தினார் என்பது வரலாறு. (நீதிப்பாடல் தந்த அவ்வையும் இவரும் வேறு வேறு என்பது இன்னொரு கதை.) வேதங்களில் சோம பானம் பற்றிய குறிப்பு உண்டு. பின்னாளில் பௌத்த, சமண மத தாக்கத்தில் மது விலக்கு பிரபல்யமடைந்தது. மனு ஸ்மிருதி பிராமணர்கள் மது அருந்துவதை கொடிய பாவமாக கூறியது. சங்க காலத்தின் பின் வந்த திருக்குறள் கள்ளுண்ணாமையை போற்றி அதிகாரம் ஒன்றையே தந்தது. கள்ளை விஷமாக வள்ளுவர் கூறினார். இதையே ஆயுர்வேதமும் கூறுகிறது.\n\nமேலைத்தேய கலாசாரத்தின் பாகமாய் ஊறிப்போன மதுவை மருத்துவம் விரோதியாக காலம் கடந்தே நோக்கியது. அதற்கு முன்னமேயே elite களின் கலாசாரமாய் அது மாறியதும், அவர்களை அடியொற்றி பின்பற்றும் ஆசியர்களின் கலாசாரமாய் மாறியது துரதிஷ்டம். மதுவை நிராகரித்த பௌத்தம் தழைத்த இலங்கையிலும் மது தன் கிளைகளை விரிவாக்கியே செல்கிறது. புத்தர் என்ன செய்வார். பிதாகரஸ், பிளாட்டோ, லிங்கன், காந்தி என பல அறிஞர்கள் மதுவை நிராகரித்து முன்னுதாரணமாய் பலருக்கும் அமைந்திருப்பது ஒரு மன ஆறுதல். காலம் தோறும் இதை நினைவுபடுத்த ஒரு பிரபலம் வந்தாக வேண்டிய தேவை உண்டு.\n\nமதுப்பழக்கம் இலங்கையில் அண்ணளவாக 20000 - 23000 உயிர்களை பறிக்கிறதாம். அதாவது நாளொன்றுக்கு 65 பேர். வந்தார் ஒரு நாள் போகத்தான் வேண்டும். ஆனால் 25 - 45 வயதிற்குட்பட்டோரின் மரணத்தின் தலையாய காரணமாக மதுவே நிற்கிறது. இலங்கையின் 60 வீதமான ஈரல் செயலிழப்பிற்கு மதுப்பழக்கமே காரணமாகிறது. ஈரல் செயலிழப்பால் உடனடியாக மரணம் ஏற்படாது. இரத்த வாந்தி, வயிறு வீக்கம், குழப்ப மனநிலை என அடிக்கடி வைத்தியசாலைக்கு சென்று பல்வேறு துன்பங்களை கடந்துதான் ஈற்றில் மரணம் சம்பவிக்கும். இலங்கையின் இலவச மருத்துவ சேவைதான் இந்த சுமையை சுமக்கிறது. இலவச கல்வியில் பயின்றோர் இலவசமாய் சேவை செய்ய வேண்டும் என்று எதிர்பார்க்கும் இச்சமுதாயம் இந்த சுமையை சிந்திப்பதில்லை. நேரடியாக ஆண்டொன்றுக்கு 69 - 140 பில்லியன் ரூபாய்கள். நேரடியாக அதிதீவிர சிகிச்சை முதலியவற்றில் செலவாகிறது. இது தாண்டி ஆளணி இழப்பு சார்ந்து கிட்டத்தட்ட 199 - 266 பில்லியன் ரூபாய்கள் இழப்பு ஏற்படுவதாக தரவுகள் கூறுகின்றன. மொத்தம் ஆண்டொன்றிற்கு தோராயமாக மொத்த உள்நாட்டு உற்பத்தியின் 2 வீதம், அதாவது 335 பில்லியன் ரூபாய்கள் மது சார் பொருளாதார இழப்பாக நோக்கப்படுகிறது.\n\nஇதைத் தாண்டி மொத்த வீதி விபத்துகளின் 19.3 வீதமானது குடிபோதையில் நிகழ்வதாக காணப்படுகிறது. சினிமாக்கள் மன அழுத்தத்தின் போது குடிப்பதை தீர்வாக காட்சிப்படுத்துகின்றன. உண்மையில் மன அழுத்தத்தை குறைக்கும் இரசாயனங்களின் அளவை குறைக்கும். நித்திரையின் அளவை குறைக்கும். நாளடைவில் தற்கொலை மனப்பான்மையை அதிகரிக்கும். வெள்ளித்திரை சூப்பர் பாடல்கள் இவற்றை காட்டுவதில்லை. முப்பாட்டன் தமிழன் கள் குடித்தான் என மார்தட்டும் சமூகம் கள்ளருந்தி மதிகெட்டு போனாரை மறந்து போவது மண்ணின் சோகம்.\n\nமது ஒரு நஞ்சு\n\nமது கொண்டாட்டம் அல்ல\n\nமது மரணம் ஆகும்\n\nதுஞ்சினார் செத்தாரின் வேறல்லர் எஞ்ஞான்றும்\nநஞ்சுண்பார் கள்ளுண் பவர்.","pr":1,"ic":"cup","g":"எண்ணங்களும் சிந்தனைகளும்"}], SYN = {"p1":{"t":"Dawn","s":"A moth loves the lamp and fears daybreak; a woman who sells her nights waits for dawn like a fast to be broken. The poem is a quiet indictment of the men who use her by night and shame her by day, with no Krishna coming to save her."},"p2":{"t":"Her","s":"An old street-woman with a cart, silver hair and torn clothes, turned away by 'respectable' people. The poet sees in her the true measure of society's progress and the quiet force that keeps the world clean."},"p3":{"t":"Daughter","s":"A father's letter to a daughter he has never had. He asks her to keep her Tamil, learn widely, resist caste and bigotry, protect other women, choose her own path, and keep one small place in her heart for him."},"p4":{"t":"The Lover","s":"Dawn, waves, moon and breeze all seem to court a woman on the shore. The poet admires her as a part of nature itself: a lover beyond imagination."},"p5":{"t":"Friend","s":"A tribute to the friend who is not family by blood but by feeling: the one who corrects, quarrels, guards your secrets and outlasts death. A sculptor who carves you over time."},"p6":{"t":"The Angel","s":"A celestial girl of the Tamil New Year, joyful at sunrise, whose voice shames the flute. The poet, another devotee of Bharathi, longs to be reborn into a world as sweet as she is."},"p7":{"t":"The One for Me","s":"Through a window the poet spots the one woman among thousands, rushes to claim her at a crowded 'bride market', and wins her: a book, with a paper body and black-and-white soul. Then another catches his eye."},"p8":{"t":"A Day in a Dream","s":"A dreamed world where caste has ended, hunger is unknown, women walk safely at midnight and every festival is shared. Waking, he insists such a world will come one day, and keeps dreaming until then."},"p9":{"t":"Dream","s":"A dream-woman who outlasts epics, her hair darker than the koel's, her dimpled cheek holding a raindrop pearl. He reaches for it and the dream dissolves."},"p10":{"t":"Love","s":"Love touches the heart before the body and the soul before the heart. A tender short poem of a withered heart that sprouts again and clings."},"p11":{"t":"Hell","s":"A village morning of gold light, flowers, birds and girls fetching water, and then the realisation that the city has destroyed such a life. The lover weeps."},"p12":{"t":"Heaven","s":"A sea's passionate kiss on the shore, held back by tiny feet at the water's edge. The waves vanish and a new paradise blooms."},"p13":{"t":"Can't You Hear Our Chatter?","s":"A dialogue with an inner voice that forbids him to write, keeps him awake and changes sides. In the end the two of them speak in a single voice."},"p14":{"t":"Known, Yet Unknown","s":"Two bodies, the storm of hormones, the silent language of touch. A frank, lyrical poem about the secret everyone knows and no one can explain, in which time itself disappears."},"p15":{"t":"Rumour","s":"A rumour challenge goes round WhatsApp and none about him appears. He notes with dry humour that someone else's turn comes first, and he will wait his."},"p16":{"t":"The Great Mistake","s":"On a beach a man watches a woman walk away in tears and asks the waves, the wind and the sky to plead for him. Was a kiss shared in a moment really so great a wrong?"},"p17":{"t":"Again","s":"Nothing in nature has failed: no bombs, no volcanoes, no war. Yet life is cracking, deaths are mounting and people are confined at home. History repeats itself, only in new costume."},"p18":{"t":"The Future","s":"A boat of imagination drifts into a dark future: poisoned air, water imported from other planets, politics unchanged. Even on Mars there is a caste fight."},"p19":{"t":"Music","s":"An ode to music: the drizzle past the umbrella, the heartbeat of nature, a refuge for the untrained listener. The poet, a pauper, begs to borrow it for the next moment."},"p20":{"t":"He Lives","s":"A man with a rope looks at the ceiling, convinced the dark is calling. A voice from somewhere asks to hear him, and from that night he lives on as a winner."},"p21":{"t":"Humanity","s":"In the Covid years some mock 'where is your God?' The poet answers that God never answered Syria, Asifa or the hungry; we should plant humanity instead and become the gods ourselves."},"p22":{"t":"God","s":"A long, angry argument with religion and caste after Asifa's murder inside a temple and the destruction of mosques and churches. The poet will not rely on a god who is a bystander, and finds his own reason enough."},"p23":{"t":"Demons","s":"Language, religion, caste, race: the demons we invented to feel superior. The same red blood runs in all, and until we change, they will haunt tomorrow's graveyards."},"p24":{"t":"To Amma","s":"A son's heart-felt letter to his mother. She carried him in the womb and in her heart for twenty-five years, starved so he could study, endured silently. He asks her to live her own life now, and says he will be her mother from here."},"p25":{"t":"A Gift for Appa","s":"A personal poem for a distant father who worked in the Gulf: a voice on a phone for years, tender yet unspoken. The son offers a free-verse poem to a man who loves tradition."},"p26":{"t":"Periyappa","s":"A tribute to an elder uncle in white veshti and khadi shirt who was a second father: elephant rides on his back, cartoon-versus-news quarrels, the last buttons the poet fastened. He did not weep then; he will go back and heal him someday."},"p27":{"t":"Miss","s":"An ode to a beloved Tamil teacher who made verse a living thing, whose real name he has forgotten but whose kindness stayed. 'Sudhakaran Miss'."},"p28":{"t":"Friend (f)","s":"A birthday poem for a woman friend, a doctor-to-be who is also a writer. He imagines Bharathi himself celebrating her and wishes her strength into her sixties."},"p29":{"t":"His Friend","s":"A poem for a friend who tells the truth even when it stings, a diamond among a thousand beads, who gives his shoulder and his life."},"p30":{"t":"This Other One","s":"A man with a storm inside and calm outside, who gives his moments only to friendship and asks that you bring flowers, not thorns."},"p31":{"t":"Them","s":"The poet finds his old certainties and arrogance falling away and discovers friendship and wisdom in older people. 'They are beautiful, and experience with them is beautiful too.'"},"p32":{"t":"To Mr. Vivek","s":"An elegy for the Tamil comedian-actor Vivek, who spread rationalism with laughter and planted trees. 'Go, and come back with your son soon. The throne named Vivek stays empty.'"},"p33":{"t":"Tuition Centre","s":"Memories of a corner classroom under a lemon tree, dictation tests, nerves and tears. Years later the wounds are sweet and he weeps only because he can no longer return."},"p34":{"t":"Wellawatte","s":"A love-letter to a Colombo neighbourhood: sand only left on the beach, a Pillaiyar shrine, Tamil voices, soaring towers, and traces of 1983. A paradise for the newcomer."},"p35":{"t":"To the Theatre","s":"A child's first cinema trip: the white screen, the dark, flying paper scraps, cigarette smoke, sleep. Years later he goes again, this time to see 'Vettaikaran' with the family."},"p36":{"t":"Birthday","s":"Why was I born? That thought vanishes on his birthday, replaced by cards, calls, Facebook greetings, and his mother's new shirt. By night the quiet returns: 'rent paid until next year'."},"p37":{"t":"Journey","s":"A two-day trip through tea estates, rubber plantations, waterfalls, leeches, rain, a jet-ski ride and a hostess named 'Ambal's'. A joyful memoir in verse of friends and nature."},"p38":{"t":"Some Angers","s":"An honest poem about anger and exhaustion: smiling faces, back-stabbers, help that never came. Perhaps I forgot to sow love. The deepest anger is turned inward."},"p39":{"t":"Thorns of Nerunji","s":"Bullying in school remembered as thorns in the heart. The survivor has lived but something within died; he asks that no one pass this filth to the next generation."},"p40":{"t":"Scissors","s":"He loved those who hated him and then grew weary. A poem about one-sided relationships; sever yourselves from me, because I do not know how to handle scissors."},"p41":{"t":"Loneliness","s":"While the whole town pulls the festival chariot, he stands alone: a child lost at the fair, a mirror for company. One day his inner cries will find a voice."},"p42":{"t":"Pages Left Behind","s":"He returns to books and friendship to fill the pages of a lost adolescence. 'The rain may stop, but the heart does not.'"},"p43":{"t":"A Dream","s":"A dream of the final-year classroom, his teacher Sudhakaran writing a poem on the board, everyone laughing. Imagination has no reins, and neither do dreams."},"p44":{"t":"Just a Wish","s":"A final-year medical student longs for his school days: paper-ball cricket, small quarrels, the gravel in his torn shoe. 'Time laughs: seize the day while the wind blows.'"},"p45":{"t":"Friendship Without Guile","s":"A long poem of a dark forest of loneliness, of friends who fell away and a few who walked him out. He now flies, and expects another forest tomorrow, ready to face it with true friends."},"p46":{"t":"Some Scribbles","s":"A set of epigrams: the sweetness of Tamil, a satire on income targets signed by a thousand-rupee note, a lover's longing, a poet's wish-list ending with 'if all that is missing, then Bharathi forever'."},"s1":{"t":"Sarada","s":"A school clerk meets Sarada on admission day, and the story follows her as mother, wife and companion, ending with a playful 'train friend' exchange."},"s2":{"t":"Love","s":"Uma waits in a maternity ward for her husband Siva. The closing lines reveal that the ward is a mental-health home, and love is both her illness and her cure."},"s3":{"t":"Poems of Emptiness","s":"A multi-part story of Raji, her daughter Amirtha and the people around them, where unspoken feelings leave a quiet emptiness."},"s4":{"t":"Falling in Love Late","s":"Rahul and Kalyani, student and sister, sit through lockdown and curfew in Sri Lanka waiting for the campus to reopen, while a quiet romance hums along."},"s5":{"t":"The Wedding of Sita","s":"A retelling of how love was born: from Shiva and Shakti's cosmic dance, through the Ganga, to Rama breaking the bow at Sita's swayamvara."},"s6":{"t":"The Lanka I Saw","s":"A mythic account of Brahma shaping the island, followed by a plea that the guardians of nature keep Sri Lanka safe for the world."},"s7":{"t":"Back to School","s":"Watching a small boy on his first day of school, the narrator relives his own and ends in gratitude to his mother: this one life at her feet is enough."},"s8":{"t":"Toddy","s":"A young man waits at the beach for his girlfriend, and a light conversation ends with his saying that he loves writing poems about her."},"d1":{"t":"Vietnam War","s":"Opens the Vietnam trip: how a friend's idea became a plan, the visa, and the group of friends who set off."},"d2":{"t":"The Auspicious Start","s":"The story of the Visa Pillaiyar shrine in Wellawatte, where people prayed for visas during the war, and the trip's blessing."},"d3":{"t":"Seven… and a Half","s":"Last-minute flight, light luggage and a very cheap trip, told with some adult humour (age warning)."},"d4":{"t":"Water, Water","s":"Immigration questions, jokes about two young men travelling together, and boarding the plane."},"d5":{"t":"Cast of Characters","s":"An introduction to the main characters of the trip: Mithra, Danush, Singh Geeth, Dushara and Rami, with their quirks."},"d6":{"t":"Ho Chi Minh City","s":"Arrival in Ho Chi Minh City: Vietnamese money explained, first impressions of the city."},"d7":{"t":"The Dancing Dragon","s":"A second flight to Da Nang, airport snacks, and the first night in a new city."},"d8":{"t":"Ba Na Hills","s":"Early morning trip to the Ba Na Hills, the cable car, the Golden Bridge and the crowds."},"d9":{"t":"Beautiful Da Nang","s":"A sick day in Da Nang, an antibiotics rant, and a lazy day in a beautiful beach town."},"d10":{"t":"The Lady Buddha","s":"Visiting the Lady Buddha in Da Nang and the many forms of Buddha in a Buddhist country."},"d11":{"t":"Hoi An","s":"Arrival at Hoi An: rooms, a four-storey stay and the first walk through the old town."},"d12":{"t":"The Room Fight","s":"Floating lanterns on the river, a wish for a partner, banh mi from a street stall, and a room quarrel."},"d13":{"t":"First Respect","s":"A trip to the coconut village, a cone hat, bargaining with agents and the first mark of respect."},"d14":{"t":"The Destination Is Not Far","s":"Driving with the hotel's car, banh mi stories and the road to the next stop."},"d15":{"t":"Journeys Never End","s":"A forgotten water park, the last day with the group and the narrator's first solo bus journey."},"d16":{"t":"A Stroll Through the Capital","s":"A bus going the wrong way, panicked prayers, a call to the group and a city walk in the capital."},"d17":{"t":"Note Cafe","s":"A church visit and the Note Cafe, a five-storey cafe covered in handwritten notes."},"d18":{"t":"The Secret Grave","s":"A locked chapter. Enter the passcode to read it."},"d19":{"t":"Tears, Tears","s":"Waking late for the bus to Sapa, the narrator's compulsion to be early, and teary-eyed moments on the road."},"d20":{"t":"Fansipan","s":"Sapa: the most beautiful place of the trip, and Fansipan."},"d21":{"t":"Cat Village","s":"Wet shoes, a smell of dead rat, waterfalls and the narrator's knee trouble on the climb."},"d22":{"t":"The Struggle","s":"A 3 a.m. bus drop, waiting for the next bus to Ha Long Bay, and a bladder-related ordeal."},"d23":{"t":"Towards the Ship","s":"The bus to Ha Long Bay and boarding the cruise boat for a two-night stay."},"d24":{"t":"Ship Tales","s":"Meals on the boat, a jacuzzi bath and onboard tales."},"d25":{"t":"Still on the Ship","s":"Bland dinner, squid fishing at night, and Singh Geeth's forgotten meal."},"d26":{"t":"Ninh Binh","s":"Ninh Binh, where Kong was filmed, a wrong hotel stop and dragging luggage to the right one."},"d27":{"t":"Kong","s":"The Mua Cave climb, the narrator and Mithra staying below to chat, and the view from the top."},"d28":{"t":"The Finale","s":"The last day in Hanoi: an apartment with five floors, a fight over beds, and a closing reflection."},"d29":{"t":"A Few More Memories","s":"Parting thoughts on Vietnam: a communist country with free-moving people, working women, and honest money habits worth copying."},"k1":{"t":"Bala Kandam","s":"Why he began to write: a reflection on how reading an essay by Muthukumar nudged him to write about himself, and a nod to the books he has loved."},"k2":{"t":"Nursery Friend","s":"A memory of preschool and a nursery friend who disappeared once the nursery years ended."},"k3":{"t":"The Dry Palm Frond","s":"Memories of three paternal aunts and a childhood fear, with a dried palm frond falling in the family garden as a symbol of the elders passing."},"k4":{"t":"Colour-Colour Papad","s":"Growing up in a strict vegetarian home, the food rules, and the laughter of colourful papads."},"k5":{"t":"The Lamps Speak","s":"Karthigai lamps and how humans came to know fire: a meditation on the lamps that speak of creation, protection and destruction."},"k6":{"t":"One God","s":"His mother's devotion, family trips that were also temple tours, and his own quiet faith."},"k7":{"t":"Victory","s":"Success as a long marathon: nobody wins alone, and defeat does not look like a demon any more."},"k8":{"t":"Visa Pillaiyar","s":"The Visa Pillaiyar shrine in Wellawatte, its legend and the community that still believes in it."},"k9":{"t":"Will the Fear Not Leave After the Journey","s":"On the lyrics of a film song that moved him, and his own difficult years that he does not want to forget: 'I have changed, but they will not leave me.'"},"k10":{"t":"The Hungry God","s":"A plea against wasting food while many go hungry: love, in the end, is the only thing that matters."},"k11":{"t":"I Have a Lover","s":"A declaration: his sweetheart is Tamil, and he loves nature, God and everything that can be loved."},"k12":{"t":"Feelings in the Mother Tongue","s":"Why feelings are best written in the mother tongue, his six years in medical school and thanks to his teachers."},"k13":{"t":"One Night","s":"A night dream of his mother and a sad film song, ending with a wish that the mother may now rest."},"k14":{"t":"Alcoholics Anonymous","s":"An essay against alcohol: how cinema glamourises it, how it ruins homes and nations, and why it is a poison, not a celebration."},"m1":{"t":"You and Me","s":"A lover begs the breeze that carries his breath not to leave him; whatever distance there is, he will follow like a shadow."},"m2":{"t":"Dear…","s":"A letter of birthday wishes he cannot finish, ending with the salutation 'Dear ........'."},"m3":{"t":"The Groom","s":"A short appeal: 'I am dry; give me your words as dowry, so I can write a poem called The Groom.'"},"m4":{"t":"What I Wish For","s":"A wish-list: literature, clouds, youth, Tamil that never leaves, and if all that fails, Bharathi."},"m5":{"t":"Her","s":"A woman who rises like a moon in black light, a sea of calm and a storm inside him."},"m6":{"t":"To Talk Literature","s":"He wants someone to talk literature with, in moonlight and rain under one umbrella."},"m7":{"t":"In the Prison of Eyes","s":"Caught in the prison of her eyes, he waits for the day the sea touches the sky."},"m8":{"t":"Flowers of Light","s":"A poem of rain, sorrow and joy, and a woman standing like cotton clouds."},"m9":{"t":"When the Journey Ends","s":"On the fear that remains when a journey is ending; new roles, new cases and the long way across the sea."},"m10":{"t":"Those Six Years","s":"Six years in the moonlight, alone under a cloudless sky, with friends who left and new bonds he hesitates over; the degree he now holds is for the words she once dropped."},"m11":{"t":"That Day","s":"Once he protected the shade-trees and held an umbrella; today there is neither umbrella nor tree. 'Give me water.'"},"m12":{"t":"My Sleeping","s":"He has long been a bad sleeper and now sells his sleep away; someday he will sleep, and nobody will wake him."},"m13":{"t":"To Swim in the Blue Sea","s":"A wish to swim in the blue sea, with only the waves hearing his cry for help, and faith in a hopeful day."},"m14":{"t":"Tears","s":"A poem on tears: is crying a man's or a woman's? And do tears have a gender?"},"m15":{"t":"Umbrellas of the Night","s":"Night umbrellas: the moon burns, bats sing, mice dance, and the poet is a street beggar of the evening."},"m16":{"t":"The Breeze","s":"A breeze in the hair of the woman who arrives; the moon fades; the breeze is his life."},"m17":{"t":"To God…","s":"A letter to God: where have you been, and when will you come? A long poem of doubt, faith and a poet's devotion."},"m18":{"t":"From Hidden Graves","s":"From hidden graves, what comes but poppy flowers? A poem on the denied histories of massacres, and the hope that justice will win one day."},"m19":{"t":"Some Fans Walked Out","s":"Some fans walked out, some stayed, some came back. Return Sri Lanka's fearless cricket to us."},"m20":{"t":"Those Beds","s":"Those hospital beds in which no one seeks comfort; they have seen birth, death and all human suffering. 'Whose turn is it tomorrow?'"}}, SB = { url: 'https://qjnhzzntxjrwzdcxwsoq.supabase.co', key: 'sb_publishable_TnMtEME7g-w5rMswKu_7Lw_BpD5f9NT' };

      '<div class="rhead"><span class="tile">' + (pre === 'm' ? tileFor(p, i + 61) : pre === 'k' ? tileFor(p, i + 101) : shell(i + 1)) + '</span><div><h1 class="work-title">' + esc(p.t) + '</h1>' +
      '<div class="work-meta">' + meta + '</div></div></div>' + enBox(pre + (i + 1)) +
      tools() + (p.im ? '<figure class="ph"><img src="' + esc(p.im) + '" alt=""></figure>' : '') + (p.pr ? '<article>' : '<article class="poem">') + body + '</article>' +
      '<nav class="pn" aria-label="அடுத்த கவிதை">' + pn(prev, i - 1, -1) + pn(next, i + 1, 1) + '</nav>' + socialBox(pre + (i + 1));
  }

  function storiesPage() {
    return '<h1 class="page-title">சிறுகதைகள்</h1><p class="page-sub">' + STORIES.length + ' சிறுகதைகள்</p><ul class="list">' +
      STORIES.map(function (s, i) {
        return '<li><a href="#s' + (i + 1) + '" data-go="s' + (i + 1) + '"><span class="row"><span class="tile ti">' + icon(s.ic, i + 7) + '</span><span class="lt">' + esc(s.t) + enTitle('s' + (i + 1)) + '</span></span><span class="lm">' + Math.max(1, Math.round(s.w / 180)) + ' நிமிடம்</span></a></li>';
      }).join('') + '</ul>';
  }
  function storyRead(i, L, pre, back, backLabel) {
    L = L || STORIES; pre = pre || 's'; back = back || 'stories'; backLabel = backLabel || 'சிறுகதைகள்';
    var s = L[i], prev = L[i - 1], next = L[i + 1];
    var body = s.b.map(function (x) {
      if (x === '§') return '<p class="orn" aria-hidden="true">· · ·</p>';
      if (x.indexOf('v:') === 0) return '<p class="stv">' + esc(x.slice(2)) + '</p>';
      if (x.indexOf('h:') === 0) return '<h2 class="sh3">' + esc(x.slice(2)) + '</h2>';
      if (x.indexOf('n:') === 0) return '<p class="snum" aria-label="பகுதி ' + esc(x.slice(2)) + '">' + esc(x.slice(2)) + '</p>';
      return '<p class="st">' + esc(x) + '</p>';
    }).join('');
    function pn(x, k, dir) {
      if (!x) return '';
      return '<a href="#' + pre + (k + 1) + '" data-go="' + pre + (k + 1) + '"><small>' + (dir < 0 ? '← முந்தையது' : 'அடுத்தது →') + '</small><span>' + esc(x.t) + '</span></a>';
    }
    return '<a class="back" href="#' + back + '" data-go="' + back + '">← ' + backLabel + '</a>' +
      (s.ic ? '<div class="rhead"><span class="tile">' + icon(s.ic, i + 7) + '</span><div><h1 class="work-title">' + esc(s.t) + '</h1><div class="work-meta">' + (i + 1) + ' / ' + L.length + ' · ' + Math.max(1, Math.round(s.w / 180)) + ' நிமிட வாசிப்பு</div></div></div>' : '<h1 class="page-title">' + esc(s.t) + '</h1><div class="work-meta">' + (i + 1) + ' / ' + L.length + ' · ' + Math.max(1, Math.round(s.w / 180)) + ' நிமிட வாசிப்பு</div>') +
      (pre === 'd' ? '<p class="note">தனியுரிமைக்காக இந்த நாட்குறிப்பிலுள்ள பெயர்கள் மாற்றப்பட்டுள்ளன.</p>' : '') + enBox(pre + (i + 1)) +
      (s.enc && !s.b.length ? '<form class="lock" data-lock="' + (i) + '"><p>இந்தப் பகுதி பூட்டப்பட்டுள்ளது. கடவுச்சொல்லை உள்ளிடுங்கள்.</p><label class="lbl" for="pw">கடவுச்சொல்</label><input id="pw" type="password" autocomplete="off"><button type="submit">திற</button><p class="err" id="lockerr" aria-live="polite"></p></form>' : '') + (s.b.length ? tools() : '') + (s.im ? '<figure class="ph"><img src="' + esc(s.im) + '" alt=""></figure>' : '') + '<article>' + body + '</article>' + (s.b.length ? '<p class="sign"><span>' + esc(BOOK.author) + ' (' + esc(BOOK.pen) + ')</span></p>' : '') +
      '<nav class="pn" aria-label="அடுத்தது">' + pn(prev, i - 1, -1) + pn(next, i + 1, 1) + '</nav>' + socialBox(pre + (i + 1));
  }
  function groupedList(L, pre) {
    var out = '', g = null;
    L.forEach(function (m, i) {
      if (m.g !== g) { if (g !== null) out += '</ul>'; g = m.g; out += '<h2 class="sec">' + esc(g) + '</h2><ul class="list">'; }
      out += '<li><a href="#' + pre + (i + 1) + '" data-go="' + pre + (i + 1) + '"><span class="row"><span class="tile ti">' + tileFor(m, i + (pre === 'm' ? 61 : 101)) + '</span><span class="lt">' + esc(m.t) + enTitle(pre + (i + 1)) + '</span></span></a></li>';
    });
    return out + '</ul>';
  }
  function draftsPage() {
    return '<a class="back" href="#poems" data-go="poems">← கவிதைகள்</a><h1 class="page-title">முந்தைய வரைவுகள்</h1><p class="page-sub">' + MORE.length + ' கவிதைகள் · பொருளின்படி தொகுத்தவை</p>' + groupedList(MORE, 'm');
  }
  function kirPage() {
    return '<h1 class="page-title">கிறுக்கல்கள்</h1><p class="page-sub">' + KIR.length + ' உரைநடைப் பதிவுகள் · நினைவுகள், பயணங்கள், எண்ணங்கள்</p>' + groupedList(KIR, 'k');
  }
  function diaryPage() {
    return '<h1 class="page-title">வியட்னாம் டயறி</h1><p class="page-sub">' + DIARY.length + ' பகுதிகள் · ஒரு பயணத்தின் நாட்குறிப்பு</p><p class="note">தனியுரிமைக்காக இந்த நாட்குறிப்பிலுள்ள பெயர்கள் மாற்றப்பட்டுள்ளன.</p><ul class="list">' +
      DIARY.map(function (s, i) {
        return '<li><a href="#d' + (i + 1) + '" data-go="d' + (i + 1) + '"><span class="row"><span class="tile ti">' + icon(s.ic, i + 7) + '</span><span class="lt">' + (s.s ? '<span class="ls">' + esc(s.l) + '</span>' + esc(s.s) : esc(s.t)) + enTitle('d' + (i + 1)) + '</span></span><span class="lm">' + (s.enc ? 'பூட்டியது' : Math.max(1, Math.round(s.w / 180)) + ' நிமிடம்') + '</span></a></li>';
      }).join('') + '</ul>';
  }

  function foreword() {
    return '<section class="ded"><p class="l">சமர்ப்பணம்</p><p class="t">' + BOOK.dedication.map(esc).join('<br>') + '</p></section>' +
      '<h1 class="page-title">என்னுரை</h1>' + tools() +
      '<div class="fw">' + BOOK.foreword.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + '</div>' +
      '<p class="sign">' + BOOK.sign.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</p>';
  }

  function aninthurai() {
    var A = BOOK.aninthurai;
    return '<h1 class="page-title">அணிந்துரை</h1>' + tools() +
      '<div class="fw">' + A.paras.map(function (t) {
        return t.indexOf('\n') >= 0 ? '<p class="verse">' + esc(t) + '</p>' : '<p>' + esc(t) + '</p>';
      }).join('') + '</div>' +
      '<p class="sign">' + A.sign.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</p>';
  }

  function about() {
    var B = BOOK.about;
    return '<h1 class="page-title">நூல் பற்றி</h1><p class="page-sub">' + esc(BOOK.title) + ' · கவிதைத் தொகுப்பு</p>' +
      '<div class="about"><figure><img src="' + esc(BEACH) + '" alt="கடற்கரையில் மறையும் சூரியனை நோக்கி நிற்கும் வேணு"><figcaption>' + esc(BOOK.author) + ' (' + esc(BOOK.pen) + ')</figcaption></figure>' +
      '<div class="txt">' + B.paras.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + '</div></div>' +
      '<dl class="facts">' + (B.facts||[]).map(function(f){return '<dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd>';}).join('') + '</dl>' +
      '<div class="book"><img src="' + esc(COVER) + '" alt="நூல் அட்டை"></div>' +
      '<div class="links"><a class="btn" href="#foreword" data-go="foreword">என்னுரை</a><a class="btn" href="#aninthurai" data-go="aninthurai">அணிந்துரை</a></div>';
  }

  function render() {
    var v = state.view, m = /^p(\d+)$/.exec(v), idx = m ? parseInt(m[1], 10) - 1 : -1;
    var main, active, ms = /^m(\d+)$/.exec(v), mi = ms ? parseInt(ms[1], 10) - 1 : -1, ss = /^s(\d+)$/.exec(v), si = ss ? parseInt(ss[1], 10) - 1 : -1, dd = /^d(\d+)$/.exec(v), di = dd ? parseInt(dd[1], 10) - 1 : -1, kk = /^k(\d+)$/.exec(v), ki = kk ? parseInt(kk[1], 10) - 1 : -1;
    if (/^n\d+$/.test(v)) { var _a = ADDED.filter(function (x) { return 'n' + x.id === v; })[0], _s = _a && sectInfo(_a.section); main = newRead(parseInt(v.slice(1), 10)); active = _s ? _s.k : ''; }
    else if (idx >= 0 && idx < POEMS.length) { main = read(idx); active = 'poems'; }
    else if (mi >= 0 && mi < MORE.length) { main = read(mi, MORE, 'm'); active = 'poems'; }
    else if (si >= 0 && si < STORIES.length) { main = storyRead(si); active = 'stories'; }
    else if (ki >= 0 && ki < KIR.length) { main = read(ki, KIR, 'k'); active = 'kirukkal'; }
    else if (v === 'kirukkal') { main = kirPage(); active = 'kirukkal'; }
    else if (v === 'drafts') { main = draftsPage(); active = 'poems'; }
    else if (di >= 0 && di < DIARY.length) { main = storyRead(di, DIARY, 'd', 'diary', 'வியட்னாம் டயறி'); active = 'diary'; }
    else if (v === 'diary') { main = diaryPage(); active = 'diary'; }
    else if (v === 'admin') { main = adminPage(); active = ''; }
    else if (v === 'new') { main = newPage(); active = ''; }
    else if (v === 'stories') { main = storiesPage(); active = 'stories'; }
    else if (v === 'poems') { main = poemsPage(); active = 'poems'; }
    else if (v === 'foreword') { main = foreword(); active = 'about'; }
    else if (v === 'aninthurai') { main = aninthurai(); active = 'about'; }
    else if (v === 'about') { main = about(); active = 'about'; }
    else if (/^c-/.test(v) && sectInfo(v.slice(2))) { main = customPage(sectInfo(v.slice(2)) && SECTS.filter(function (s) { return s.key === v.slice(2); })[0]); active = v; }
    else { state.view = ''; main = home(); active = 'home'; }
    var wn = { poems: 'poems', stories: 'stories', kirukkal: 'kirukkal', diary: 'diary' }[v];
    if (wn && addedIn(wn).length) main = main.replace(/(<p class="page-sub">[\s\S]*?<\/p>)/, '$1' + addedBlock(wn));
    document.documentElement.style.setProperty('--scale', state.scale);
    document.getElementById('app').innerHTML = header(active) + main +
      '<footer>© ' + esc(BOOK.author) + ' (' + esc(BOOK.pen) + ')' + (sbOn() ? ' · வருகையாளர்கள்: <span id="visn">' + (SITEN === null ? '…' : SITEN.toLocaleString('en-US')) + '</span> · <span class="tot" id="tot"></span>' : '') + '</footer>';
    if (state.view === 'poems') fillGrid();
    loadSocial(); totalViews(); siteViews();
  }

  function go(view) {
    state.view = view === 'home' ? '' : view;
    render();
    try { history.replaceState(null, '', '#' + (view || 'home')); } catch (e) {}
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-go],[data-size]') : null;
    if (!t) return;
    if (t.hasAttribute('data-go')) {
      e.preventDefault();
      go(t.getAttribute('data-go'));
    } else {
      var s = Math.round((state.scale + parseInt(t.getAttribute('data-size'), 10) * 0.1) * 100) / 100;
      state.scale = Math.min(1.6, Math.max(0.85, s));
      document.documentElement.style.setProperty('--scale', state.scale);
      try { localStorage.setItem('kilinjal-scale', String(state.scale)); } catch (err) {}
    }
  });
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var k = 0; k < b.length; k++) u[k] = b.charCodeAt(k); return u; }
  document.addEventListener('submit', function (e) {
    var f = e.target.closest ? e.target.closest('[data-lock]') : null; if (!f) return;
    e.preventDefault();
    var s = DIARY[parseInt(f.getAttribute('data-lock'), 10)], pw = f.querySelector('input').value.trim().toLowerCase(), err = document.getElementById('lockerr');
    if (!(window.crypto && crypto.subtle)) { err.textContent = 'இந்த உலாவியில் திறக்க இயலாது.'; return; }
    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (k) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(s.enc.s), iterations: 150000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (k) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(s.enc.i) }, k, b64(s.enc.c));
    }).then(function (buf) { s.b = JSON.parse(new TextDecoder().decode(buf)); render(); }, function () { err.textContent = 'கடவுச்சொல் சரியில்லை.'; });
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'q') { state.q = e.target.value; fillGrid(); }
  });
  window.addEventListener('hashchange', function () {
    state.view = location.hash.replace('#', '');
    if (state.view === 'home') state.view = '';
    render();
  });

  state.view = (location.hash || '').replace('#', '');
  if (state.view === 'home') state.view = '';
  render();
  loadAdded();
})();
</script>
</body></html>
